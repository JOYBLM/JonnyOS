<style>
  :root{
    --lcd:#c9d6bf;
    --lcd-hi:#dbe6d2;
    --lcd-lo:#a9b89f;
    --ink:#2b3226;
    --ink-soft:#4a5442;
    --win-face:#c8c4bb;
    --win-hi:#f2f0e8;
    --win-lo:#83807a;
    --win-shadow:#55524d;
    --title-a:#8fa9c9;
    --title-b:#4a6a94;
    --accent:#e8935a;
    --accent2:#6fae8f;
    --danger:#b95050;
    --radius:3px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0; overflow:hidden; background:#111; overscroll-behavior:none;}
  body{
    font-family:'VT323', monospace;
    font-size:21px;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }

  #device{
    width:100%; height:100%;
    max-width:520px;
    position:relative;
    background:
      linear-gradient(180deg, var(--lcd-hi), var(--lcd) 12%, var(--lcd) 88%, var(--lcd-lo));
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  #device::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply;
    opacity:0.5;
    z-index:9999;
  }

  /* ---------- TAP FEEDBACK ---------- */
  .tap{opacity:0.6 !important; transform:scale(0.95); transition:transform .06s ease, opacity .06s ease;}

  /* ---------- STATUS BAR ---------- */
  #statusbar{
    padding-top: calc(6px + var(--safe-top));
    height: calc(30px + var(--safe-top));
    display:flex; align-items:center; justify-content:space-between;
    padding-left:10px; padding-right:10px;
    font-size:16px;
    color:var(--ink);
    background:rgba(255,255,255,0.15);
    border-bottom:1px solid var(--win-lo);
    flex-shrink:0;
    z-index:500;
    position:relative;
  }
  #statusbar .sb-left{display:flex; align-items:center; gap:6px;}
  #statusbar .sb-right{display:flex; align-items:center; gap:8px;}
  .battery{
    width:22px; height:11px; border:1.5px solid var(--ink); border-radius:2px; position:relative; padding:1px;
  }
  .battery::after{content:""; position:absolute; right:-4px; top:3px; width:2px; height:5px; background:var(--ink);}
  .battery i{display:block; height:100%; background:var(--ink); width:70%;}
  .bars{display:flex; align-items:flex-end; gap:1.5px; height:10px;}
  .bars b{display:block; width:3px; background:var(--ink-soft);}
  .bars b:nth-child(1){height:3px;} .bars b:nth-child(2){height:5px;}
  .bars b:nth-child(3){height:7px;} .bars b:nth-child(4){height:10px;}
  .bars.on b{background:var(--ink);}

  /* ---------- SCREENS (views) ---------- */
  #view-stack{ position:relative; flex:1; min-height:0; }
  .view{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
  }
  .view.active{display:flex;}

  #view-home.wall-dither{background-image:repeating-conic-gradient(var(--lcd-lo) 0% 25%, var(--lcd) 0% 50%); background-size:6px 6px;}
  #view-home.wall-plaid{background-image: repeating-linear-gradient(0deg, rgba(74,90,66,0.15) 0 2px, transparent 2px 22px), repeating-linear-gradient(90deg, rgba(74,90,66,0.15) 0 2px, transparent 2px 22px);}
  #view-home.wall-dots{background-image:radial-gradient(rgba(74,90,66,0.3) 1.5px, transparent 1.5px); background-size:16px 16px;}
  #view-home.wall-solid{background-image:none;}
  #view-home.wall-photo{background-repeat:no-repeat;}
  #view-home.wall-photo::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:repeating-conic-gradient(rgba(20,26,16,0.18) 0% 25%, transparent 0% 50%);
    background-size:4px 4px; mix-blend-mode:multiply; opacity:0.55;
  }

  /* ---------- BOOT ---------- */
  #view-boot{ align-items:center; justify-content:center; background:#20261d; color:var(--lcd); gap:18px; }
  #view-boot .logo{ font-family:'Press Start 2P'; font-size:20px; text-align:center; letter-spacing:1px; text-shadow:2px 2px 0 #0d100a;}
  #view-boot .logo small{display:block; font-size:9px; margin-top:10px; opacity:0.7; letter-spacing:2px;}
  .boot-bar{width:70%; height:14px; border:2px solid var(--lcd); border-radius:2px; overflow:hidden; background:#0d100a;}
  .boot-bar i{display:block; height:100%; width:0%; background:repeating-linear-gradient(90deg, var(--lcd) 0 6px, #97a68c 6px 8px); transition:width .18s linear;}
  #view-boot .boot-msg{font-size:14px; opacity:0.7;}

  /* ---------- LOGIN (accounts) ---------- */
  #view-login{
    align-items:center; justify-content:flex-start;
    background: radial-gradient(circle at 50% 15%, #d8e3cf, #b9c7ae 70%);
    padding:calc(40px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
    gap:14px;
  }
  .login-header{text-align:center; margin-bottom:6px;}
  .login-title{font-family:'Press Start 2P'; font-size:18px; color:var(--ink); text-shadow:2px 2px 0 rgba(255,255,255,0.5);}
  .login-sub{font-size:17px; color:var(--ink-soft); margin-top:6px;}
  #login-list{width:100%; max-width:320px; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 0;}
  .login-account{
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    border-radius:8px; cursor:pointer;
  }
  .login-avatar{
    width:46px; height:46px; border-radius:50%; background:var(--lcd-hi); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    border:2px solid var(--win-shadow);
  }
  .login-name{flex:1; font-size:19px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .login-del{flex-shrink:0;}
  #login-new-btn{width:100%; max-width:320px; margin-top:6px;}

  /* ---------- LOCK ---------- */
  #view-lock{
    align-items:center; justify-content:space-between;
    background:
      radial-gradient(circle at 50% 20%, #d8e3cf, #b9c7ae 70%);
    padding:40px 20px 60px;
    cursor:pointer;
  }
  #view-lock .lock-top{margin-top:14%; text-align:center;}
  #view-lock .lock-clock{font-family:'Press Start 2P'; font-size:40px; color:var(--ink); text-shadow:2px 2px 0 rgba(255,255,255,0.5);}
  #view-lock .lock-date{margin-top:10px; font-size:22px; color:var(--ink-soft);}
  #view-lock .lock-hint{font-size:18px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:6px; animation:bob 1.6s ease-in-out infinite;}
  #view-lock .chev{font-size:22px;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  #lock-notifications{width:100%; max-width:320px; display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .lock-notif{
    background:rgba(255,255,255,0.55); border:1px solid rgba(74,90,66,0.3); border-radius:8px;
    padding:9px 12px; display:flex; align-items:center; gap:10px; font-size:15px; text-align:left;
    backdrop-filter:blur(2px);
  }
  .lock-notif .ln-icon{font-size:18px;}
  .lock-notif .ln-text{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- HOME ---------- */
  #home-scroll{flex:1; overflow:hidden; position:relative;}
  #home-pages-track{display:flex; height:100%; width:100%; transition:transform .28s ease;}
  .home-page{flex:0 0 100%; width:100%; max-width:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 10px; box-sizing:border-box;}
  #page-dots{display:flex; justify-content:center; align-items:center; gap:8px; padding:6px 0 8px; flex-shrink:0;}
  #page-dots .page-dot{width:7px; height:7px; border-radius:50%; background:var(--win-lo); border:1px solid var(--win-shadow);}
  #page-dots .page-dot.active{background:var(--ink);}
  #home-widgets{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .widget-clock{
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    border-radius:8px; padding:14px; display:flex; align-items:center; justify-content:space-between;
  }
  .widget-clock .wc-time{font-family:'Press Start 2P'; font-size:24px;}
  .widget-clock .wc-date{font-size:15px; color:var(--ink-soft); margin-top:4px;}
  .widget-nowplaying{
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    border-radius:8px; padding:10px 12px; display:flex; align-items:center; gap:10px;
  }
  .widget-nowplaying .np-icon{font-size:20px;}
  .widget-nowplaying .np-info{flex:1; min-width:0;}
  .widget-nowplaying .np-title{font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .widget-nowplaying .np-sub{font-size:12px; color:var(--ink-soft);}
  .widget-nowplaying .np-play{font-size:20px; padding:4px 10px;}
  .widget-sticky{
    background:#f2e5a1; border:1px solid #c9b76a; border-radius:2px; box-shadow:2px 2px 4px rgba(0,0,0,0.2);
    padding:10px 12px; font-size:15px; color:#4a4222; min-height:22px; transform:rotate(-0.6deg);
  }
  .widget-sticky textarea{
    width:100%; background:transparent; border:none; resize:none; font-family:'VT323'; font-size:15px;
    color:#4a4222; min-height:40px; padding:0;
  }
  .home-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:18px 8px;
  }
  .app-icon{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    position:relative; padding:4px 0;
  }
  .app-icon .glyph{
    width:58px; height:58px;
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    border-radius:10px;
    position:relative;
    overflow:visible;
    background-size:cover; background-position:center;
  }
  .app-icon.pressed .glyph{
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi);
  }
  .app-icon .label{font-size:14px; color:var(--ink); text-align:center; line-height:1.05; text-shadow:0 1px 0 rgba(255,255,255,0.6);}
  .app-icon .remove-x{
    position:absolute; top:-8px; right:4px; width:22px; height:22px; border-radius:50%;
    background:var(--danger); color:#fff; font-size:14px; display:none;
    align-items:center; justify-content:center; border:1px solid #7a2f2f; line-height:0;
  }
  .app-icon .edit-pencil{
    position:absolute; top:-8px; left:4px; width:22px; height:22px; border-radius:50%;
    background:var(--title-b); color:#fff; font-size:12px; display:none;
    align-items:center; justify-content:center; border:1px solid #2f4a6a; line-height:0;
  }
  .app-icon.jiggle .glyph{animation:jiggle .22s infinite;}
  .app-icon.jiggle .remove-x{display:flex;}
  .app-icon.builtin .remove-x{display:none !important;}
  .app-icon.jiggle .edit-pencil{display:flex;}
  .notif-badge{
    position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; border-radius:9px;
    background:var(--danger); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
    padding:0 4px; border:1px solid #7a2f2f; font-family:'VT323';
  }
  @keyframes jiggle{0%{transform:rotate(-1.5deg);}50%{transform:rotate(1.5deg);}100%{transform:rotate(-1.5deg);}}

  .drag-ghost{
    position:absolute; z-index:6000; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:5px;
    opacity:0.92; transform:scale(1.1); filter:drop-shadow(2px 3px 4px rgba(0,0,0,0.4));
  }
  .drag-ghost .remove-x, .drag-ghost .edit-pencil, .drag-ghost .notif-badge{display:none !important;}
  .edge-glow{position:absolute; top:0; bottom:0; width:36px; z-index:5000; pointer-events:none; opacity:0; transition:opacity .15s;}
  .edge-glow.left{left:0; background:linear-gradient(90deg, rgba(74,90,66,0.35), transparent);}
  .edge-glow.right{right:0; background:linear-gradient(-90deg, rgba(74,90,66,0.35), transparent);}
  .edge-glow.show{opacity:1;}

  /* ---------- ACTION SHEET ---------- */
  #action-sheet{position:absolute; inset:0; z-index:4000; background:rgba(0,0,0,0.35); display:flex; align-items:flex-end;}
  .action-sheet-box{
    width:100%; background:var(--win-face); border-top:2px solid var(--win-hi); border-radius:10px 10px 0 0;
    padding:14px; padding-bottom:calc(14px + var(--safe-bottom)); display:flex; flex-direction:column; gap:8px;
  }
  .action-sheet-title{font-family:'Press Start 2P'; font-size:12px; text-align:center; margin-bottom:4px; color:var(--ink-soft);}
  .action-sheet-item{font-size:19px;}

  /* ---------- RECENTS SWITCHER ---------- */
  #recents-overlay{position:absolute; inset:0; z-index:3500; background:rgba(20,24,16,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:14px;}
  #recents-overlay .rc-title{font-family:'Press Start 2P'; font-size:13px; color:var(--lcd); margin-bottom:6px;}
  #recents-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:320px;}
  .recent-card{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .recent-card .glyph{width:54px; height:54px; font-size:26px;}
  .recent-card .label{color:var(--lcd); font-size:13px;}

  /* ---------- MESSAGES ---------- */
  #msg-thread{display:flex; flex-direction:column; height:100%;}
  #msg-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 2px; display:flex; flex-direction:column; gap:8px;}
  .msg-bubble{max-width:75%; padding:9px 12px; border-radius:14px; font-size:17px; line-height:1.25; word-wrap:break-word;}
  .msg-bubble.them{align-self:flex-start; background:var(--win-face); border-bottom-left-radius:4px;}
  .msg-bubble.me{align-self:flex-end; background:var(--accent2); color:#173026; border-bottom-right-radius:4px;}
  .msg-bubble.typing{align-self:flex-start; background:var(--win-face); color:var(--ink-soft); font-style:italic;}
  .msg-sender-name{font-size:12px; font-weight:bold; color:var(--title-b); margin-bottom:2px;}
  .app-share-card{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.55); border-radius:8px; padding:8px; min-width:140px;}
  .app-share-card .asc-icon{font-size:24px;}
  .app-share-card .asc-name{flex:1; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .app-share-card .asc-sent{font-size:12px; color:var(--ink-soft); flex-shrink:0;}
  .msg-time{font-size:11px; color:var(--ink-soft); margin-top:2px; text-align:right;}
  #msg-input-row{display:flex; gap:8px; padding-top:8px; border-top:1px solid var(--win-lo); margin-top:8px;}
  #msg-input-row input{flex:1; padding:10px; font-family:'VT323'; font-size:18px; background:var(--lcd-hi);
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow); border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi); border-radius:4px;}


  #view-drawer{background:rgba(40,46,36,0.94); color:var(--lcd); padding-top:calc(14px + var(--safe-top));}
  #drawer-header{padding:0 16px 10px; font-family:'Press Start 2P'; font-size:13px; letter-spacing:1px;}
  #drawer-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 14px 16px;}
  #drawer-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px 8px;}
  #drawer-grid .app-icon .label{color:var(--lcd);}

  /* ---------- WINDOW (app screen) ---------- */
  #view-app{background:var(--win-face);}
  #app-titlebar{
    flex-shrink:0;
    height:calc(38px + var(--safe-top));
    padding-top:var(--safe-top);
    background:linear-gradient(180deg, var(--title-a), var(--title-b));
    display:flex; align-items:center; justify-content:space-between;
    padding-left:8px; padding-right:6px;
    border-bottom:2px solid var(--win-shadow);
  }
  #app-titlebar .title-left{display:flex; align-items:center; gap:8px; color:#fff; text-shadow:1px 1px 0 rgba(0,0,0,0.4); min-width:0;}
  #app-titlebar .title-left .ticon{font-size:19px;}
  #app-titlebar .title-left .tname{font-size:19px; letter-spacing:0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .win-btn{
    width:32px; height:28px;
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    display:flex; align-items:center; justify-content:center;
    font-family:'VT323'; font-size:17px; font-weight:bold; color:var(--ink);
  }
  .win-btn:active{
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi);
  }
  #app-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; background:var(--lcd);}
  #app-body h2{margin:0 0 10px; font-family:'Press Start 2P'; font-size:14px; color:var(--ink);}
  #app-body p{line-height:1.4; margin:0 0 10px;}

  .panel{
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    padding:12px; border-radius:6px; margin-bottom:12px;
  }
  .panel-inset{
    background:var(--lcd-hi);
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi);
    padding:10px; border-radius:4px;
  }
  .btn98{
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    padding:11px 16px; font-family:'VT323'; font-size:19px; color:var(--ink); border-radius:5px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:40px;
  }
  .btn98:active{
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi);
  }
  .btn98.accent{background:var(--accent2); color:#173026;}
  .btn98.warn{background:var(--danger); color:#fff;}
  .btn98.full{width:100%;}
  .btn98.small{padding:6px 10px; font-size:16px; min-height:32px;}
  .btn98[disabled]{opacity:0.5;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 4px; border-bottom:1px solid var(--win-lo); min-height:36px;}
  .row:last-child{border-bottom:none;}
  .row .row-label{font-size:19px;}
  .row .row-sub{font-size:14px; color:var(--ink-soft); margin-top:2px;}

  .toggle{
    width:50px; height:28px; border-radius:14px; background:var(--win-lo); position:relative; flex-shrink:0;
    border-top:1px solid var(--win-shadow); border-left:1px solid var(--win-shadow);
  }
  .toggle i{position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:var(--win-hi); transition:left .15s;}
  .toggle.on{background:var(--accent2);}
  .toggle.on i{left:24px;}

  /* ---------- TASKBAR / NAV ---------- */
  #taskbar{
    flex-shrink:0;
    height:calc(58px + var(--safe-bottom));
    padding-bottom:var(--safe-bottom);
    background:var(--win-face);
    border-top:2px solid var(--win-hi);
    box-shadow:0 -1px 0 var(--win-shadow);
    display:flex; align-items:center; justify-content:space-between;
    padding-left:6px; padding-right:10px;
    position:relative; z-index:600;
  }
  #start-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    padding:9px 12px; border-radius:5px; font-size:18px; font-weight:bold; min-height:40px;
  }
  #start-btn.active, #start-btn:active{
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi);
  }
  #start-icon{width:18px; height:18px; border-radius:4px; display:block; image-rendering:auto;}

  #nav-center{display:flex; align-items:center; gap:16px;}
  .nav-back{font-size:24px; color:var(--ink-soft); padding:10px 12px;}
  .home-wheel{
    width:48px; height:48px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #efe9de, #a9a598 75%);
    border:2px solid var(--win-shadow);
    display:flex; align-items:center; justify-content:center;
  }
  .home-wheel i{width:16px; height:16px; border-radius:50%; background:var(--win-face); border:1px solid var(--win-shadow);}
  .nav-drawer-btn{display:flex; flex-direction:column; gap:3px; padding:12px;}
  .nav-drawer-btn b{display:block; width:18px; height:2px; background:var(--ink-soft);}

  #tb-clock{font-size:17px; min-width:52px; text-align:right;}

  /* ---------- START MENU ---------- */
  #start-menu{
    position:absolute; left:6px; bottom:calc(58px + var(--safe-bottom) + 4px);
    width:230px; max-height:64%; overflow-y:auto;
    background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    z-index:800; display:none; border-radius:6px 6px 6px 2px;
    box-shadow:3px 3px 8px rgba(0,0,0,0.35);
  }
  #start-menu.open{display:block;}
  #start-menu .sm-head{
    background:linear-gradient(180deg, var(--title-a), var(--title-b));
    color:#fff; padding:10px 8px; font-family:'Press Start 2P'; font-size:11px;
    border-radius:4px 4px 0 0;
  }
  .sm-item{display:flex; align-items:center; gap:10px; padding:11px 10px; font-size:17px; border-bottom:1px solid #d8d5cc; min-height:38px;}
  .sm-item .sm-ic{font-size:18px; width:22px; text-align:center;}
  .sm-item:active{background:var(--title-b); color:#fff;}
  .sm-sep{height:1px; background:var(--win-shadow); margin:2px 0; box-shadow:0 1px 0 var(--win-hi);}

  #dim{position:absolute; inset:0; background:rgba(0,0,0,0.3); z-index:700; display:none;}
  #dim.show{display:block;}

  #alarm-overlay{position:absolute; inset:0; z-index:5000; background:rgba(20,24,16,0.92); display:flex; align-items:center; justify-content:center; padding:20px;}
  #call-incoming-overlay{position:absolute; inset:0; z-index:5100; background:rgba(20,24,16,0.92); display:flex; align-items:center; justify-content:center; padding:20px;}
  .alarm-box{background:var(--win-face); border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi); border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow); border-radius:8px; padding:26px 20px; text-align:center; width:100%; max-width:280px; animation:alarmshake 0.4s ease-in-out infinite;}
  .alarm-icon{font-size:44px;}
  .alarm-title{font-family:'Press Start 2P'; font-size:16px; margin-top:8px; color:var(--danger);}
  .alarm-time{font-family:'Press Start 2P'; font-size:28px; margin-top:10px;}
  @keyframes alarmshake{0%,100%{transform:rotate(-0.6deg);}50%{transform:rotate(0.6deg);}}

  #toast{position:absolute; left:50%; bottom:calc(76px + var(--safe-bottom)); transform:translateX(-50%);
    background:rgba(30,34,26,0.92); color:var(--lcd); padding:9px 16px; border-radius:16px; font-size:16px;
    z-index:1600; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;}
  #toast.show{opacity:1;}

  /* ---------- store ---------- */
  .store-tabs{display:flex; gap:8px; margin-bottom:12px;}
  .store-tab{flex:1;}
  .store-card{display:flex; gap:10px; align-items:center; padding:11px 0; border-bottom:1px solid var(--win-lo);}
  .store-card:last-child{border-bottom:none;}
  .store-card .glyph{
    width:46px; height:46px; flex-shrink:0; border-radius:9px;
    background:var(--win-face); display:flex; align-items:center; justify-content:center; font-size:22px;
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
  }
  .store-card .meta{flex:1; min-width:0;}
  .store-card .meta .nm{font-size:19px;}
  .store-card .meta .ds{font-size:14px; color:var(--ink-soft);}
  .store-card .act{width:82px; text-align:center; font-size:15px; padding:9px 4px;}

  #calc-display{font-family:'Press Start 2P'; font-size:26px; text-align:right; padding:16px 10px; margin-bottom:10px; word-break:break-all; min-height:34px;}
  #calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  #calc-grid .btn98{padding:16px 0; font-size:20px;}

  .editor-area{width:100%; height:260px; background:var(--lcd-hi); border:none; resize:none; font-family:'VT323'; font-size:19px; padding:10px; color:var(--ink);
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi); border-radius:4px;}

  canvas{background:var(--lcd-hi); border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow); border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi); touch-action:none; max-width:100%;}
  #ttt-grid{display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(3,64px); gap:6px; width:220px; margin:0 auto;}
  .ttt-cell{background:var(--lcd-hi); display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P'; font-size:22px;
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow); border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi);}
  #mine-grid{display:grid; grid-template-columns:repeat(8, 1fr); grid-template-rows:repeat(8,32px); gap:2px; width:270px; margin:0 auto;}
  .mine-cell{background:var(--win-face); display:flex; align-items:center; justify-content:center; font-size:14px;
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi); border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);}
  .mine-cell.open{background:var(--lcd-hi); border:1px solid var(--win-lo);}
  .mine-cell.mine{background:var(--danger);}

  .g2048-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:264px; margin:0 auto; background:var(--win-lo); padding:6px; border-radius:6px;}
  .g2048-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P'; font-size:13px; background:var(--lcd-hi); border-radius:4px; color:var(--ink);}
  .mem-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:264px; margin:0 auto;}
  .mem-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:24px; background:var(--win-face); border-radius:6px;
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi); border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);}
  .mem-cell.flipped, .mem-cell.matched{background:var(--lcd-hi); border:1px solid var(--win-lo);}

  .wheel-player{
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle at 35% 25%, #f4f0e6, #b4b0a2 75%);
    border:3px solid var(--win-shadow);
    position:relative; margin:14px auto;
  }
  .wheel-center{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:86px; height:86px; border-radius:50%; background:var(--win-face);
    border-top:2px solid var(--win-hi); border-left:2px solid var(--win-hi);
    border-bottom:2px solid var(--win-shadow); border-right:2px solid var(--win-shadow);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .wheel-label{position:absolute; font-size:13px; color:var(--ink-soft); letter-spacing:1px; padding:8px;}
  .wl-top{top:6px; left:50%; transform:translateX(-50%);}
  .wl-bottom{bottom:6px; left:50%; transform:translateX(-50%);}
  .wl-left{left:6px; top:50%; transform:translateY(-50%);}
  .wl-right{right:6px; top:50%; transform:translateY(-50%);}
  #track-name{font-size:20px; text-align:center; margin-top:4px;}
  #track-artist{font-size:15px; text-align:center; color:var(--ink-soft);}
  #music-progress{width:100%; height:9px; background:var(--win-lo); border-radius:4px; overflow:hidden; margin:10px 0 4px;}
  #music-progress i{display:block; height:100%; width:0%; background:var(--accent2);}
  #vol-slider{width:100%; margin-top:10px; accent-color:var(--accent2);}

  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .photo-cell{aspect-ratio:1; border-radius:4px; border:1px solid var(--win-lo); background-size:cover; background-position:center; overflow:hidden;}
  .photo-cell img{width:100%; height:100%; object-fit:cover; display:block;}
  #photo-full{position:absolute; inset:0; background:#111; display:none; align-items:center; justify-content:center; z-index:2000;}
  #photo-full.show{display:flex;}
  #photo-full div, #photo-full img, #photo-full video{width:86%; max-height:80%; border-radius:6px; object-fit:contain;}
  #photo-full span{position:absolute; top:calc(14px + var(--safe-top)); right:14px; color:#fff; font-size:30px; padding:6px 12px;}

  .files-tree .f-row{display:flex; align-items:center; gap:8px; padding:11px 4px; border-bottom:1px solid var(--win-lo); font-size:18px; min-height:38px;}
  .f-row .f-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .f-row .f-del{font-size:16px; padding:6px 10px;}
  #files-crumb{font-size:15px; color:var(--ink-soft); margin-bottom:8px;}

  #browser-bar{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  #browser-bar #browser-url{flex:1 1 140px; min-width:0;}
  #browser-url{flex:1; padding:10px 8px; font-family:'VT323'; font-size:17px; background:var(--lcd-hi);
    border-top:2px solid var(--win-shadow); border-left:2px solid var(--win-shadow); border-bottom:2px solid var(--win-hi); border-right:2px solid var(--win-hi); border-radius:3px;}

  #cam-video{width:100%; border-radius:8px; background:#000; display:block;}
  .cam-shutter{width:70px; height:70px; border-radius:50%; background:#fff; border:5px solid var(--win-shadow); margin:16px auto 0;}
  .cam-shutter.rec-mode{background:var(--danger); border-color:#7a2f2f;}
  .cam-shutter.recording{border-radius:14px; width:40px; height:40px; margin:34px auto 16px;}
  .cam-flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:1900;}
  .cam-flash.go{animation:flashfx .25s ease;}
  .cam-controls-row{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:6px;}
  .cam-flip-btn{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px;}
  .cam-mode-tabs{display:flex; gap:8px; margin-bottom:10px;}
  .cam-mode-tabs .btn98{flex:1;}
  .rec-timer{text-align:center; font-family:'Press Start 2P'; font-size:15px; color:var(--danger); margin-top:8px; min-height:20px;}
  .video-cell{position:relative;}
  .video-cell video{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
  .video-cell .play-badge{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; text-shadow:0 0 4px rgba(0,0,0,0.8); background:rgba(0,0,0,0.15);}
  .embed-frame{width:100%; border:none; border-radius:6px; background:#000;}
  .quickpick-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .quickpick-row .btn98{font-size:15px;}
  @keyframes flashfx{0%{opacity:0.9;}100%{opacity:0;}}

  .cal-dow-row, .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-dow{font-size:13px; color:var(--ink-soft); padding:4px 0;}
  .cal-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:var(--lcd-hi); border:1px solid var(--win-lo); font-size:15px; position:relative; border-radius:4px;}
  .cal-cell.empty{background:transparent; border:none;}
  .cal-cell.today{background:var(--accent2); color:#173026; font-weight:bold;}
  .cal-cell .dot{position:absolute; bottom:3px; width:5px; height:5px; border-radius:50%; background:var(--accent);}

  .big-timer{font-family:'Press Start 2P'; font-size:36px; text-align:center; margin:20px 0;}
  .tabbar{display:flex; gap:8px; margin-bottom:12px;}
  .tabbar .btn98{flex:1;}

  ::-webkit-scrollbar{width:0px;}
</style>

  var DAY_TRADER_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>Trade Up \u2014 Day Trader<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#E9F7EE;\n    --surface:#FFFFFF;\n    --surface-2:#F2FBF5;\n    --ink:#122A1B;\n    --ink-soft:#4C6B58;\n    --green:#1FAA59;\n    --green-dark:#128244;\n    --green-bg:rgba(31,170,89,0.14);\n    --gold:#FFC93C;\n    --gold-dark:#E6A800;\n    --red:#E5484D;\n    --red-bg:rgba(229,72,77,0.14);\n    --border:#122A1B;\n    --shadow-col:#122A1B;\n    --font-display:'Fredoka','Baloo 2',system-ui,-apple-system,sans-serif;\n    --font-body:'Inter',system-ui,-apple-system,sans-serif;\n    --font-mono:'JetBrains Mono',ui-monospace,monospace;\n  }\n  @media (prefers-color-scheme: dark){\n    :root:not([data-theme=\"light\"]){\n      --bg:#0E1911; --surface:#15241A; --surface-2:#122019;\n      --ink:#E9F7EE; --ink-soft:#93B4A1;\n      --green:#33C574; --green-dark:#28A863; --green-bg:rgba(51,197,116,0.16);\n      --gold:#FFD666; --gold-dark:#F0BE3E;\n      --red:#FF7A7E; --red-bg:rgba(255,122,126,0.16);\n      --border:#E9F7EE; --shadow-col:#E9F7EE;\n    }\n  }\n  :root[data-theme=\"dark\"]{\n    --bg:#0E1911; --surface:#15241A; --surface-2:#122019;\n    --ink:#E9F7EE; --ink-soft:#93B4A1;\n    --green:#33C574; --green-dark:#28A863; --green-bg:rgba(51,197,116,0.16);\n    --gold:#FFD666; --gold-dark:#F0BE3E;\n    --red:#FF7A7E; --red-bg:rgba(255,122,126,0.16);\n    --border:#E9F7EE; --shadow-col:#E9F7EE;\n  }\n\n  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}\n  html,body{height:100%;}\n  body{\n    margin:0; background:var(--bg); color:var(--ink);\n    font-family:var(--font-body);\n    overscroll-behavior:none;\n    -webkit-user-select:none; user-select:none;\n    display:flex; justify-content:center;\n  }\n  button{font-family:inherit; -webkit-user-select:none; user-select:none;}\n\n  .app{\n    width:100%; max-width:480px; min-height:100dvh;\n    display:flex; flex-direction:column;\n    background:var(--bg); position:relative;\n  }\n  @media (min-width:521px){\n    body{padding:28px 0;}\n    .app{\n      min-height:min(880px, 100dvh - 56px);\n      border:3px solid var(--border); border-radius:28px;\n      box-shadow:8px 8px 0 var(--shadow-col); overflow:hidden;\n    }\n  }\n\n  .topbar{\n    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;\n    display:flex; align-items:center; justify-content:space-between; gap:10px;\n  }\n  .brand{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:600; font-size:19px; }\n  .brand .dot{ width:10px;height:10px;border-radius:50%; background:var(--green); box-shadow:0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }\n  .icon-btn{\n    width:38px;height:38px; border-radius:12px; border:2px solid var(--border);\n    background:var(--surface); display:flex;align-items:center;justify-content:center;\n    font-size:17px; box-shadow:3px 3px 0 var(--shadow-col); cursor:pointer;\n  }\n  .icon-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow-col); }\n\n  .levelcard{\n    margin:4px 18px 0; padding:10px 14px;\n    background:var(--surface); border:2px solid var(--border); border-radius:14px;\n    box-shadow:3px 3px 0 var(--shadow-col);\n  }\n  .levelrow{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--ink-soft); font-weight:600; }\n  .levelrow b{ color:var(--ink); font-size:13.5px; }\n  .progress-track{ margin-top:7px; height:9px; border-radius:6px; background:var(--surface-2); border:1.5px solid var(--border); overflow:hidden; }\n  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width .35s ease; }\n\n  .main{ flex:1; overflow-y:auto; padding:0 0 90px; -webkit-overflow-scrolling:touch; }\n\n  /* ---------- TRADE ---------- */\n  .trade-panel{ padding:14px 18px 6px; }\n\n  .price-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }\n  .price-name{ font-weight:700; font-size:13.5px; }\n  .price-name .sym{ color:var(--ink-soft); font-weight:600; font-size:11.5px; margin-left:4px; }\n  .price-right{ text-align:right; }\n  .price-value{ font-family:var(--font-mono); font-weight:600; font-size:24px; }\n  .price-change{ font-family:var(--font-mono); font-size:12px; font-weight:600; }\n  .price-change.up{ color:var(--green-dark); }\n  .price-change.down{ color:var(--red); }\n\n  .streak-badge{\n    display:inline-flex; align-items:center; gap:5px; margin-top:6px;\n    background:var(--gold); border:2px solid var(--border); border-radius:9px;\n    padding:3px 9px; font-size:11.5px; font-weight:700;\n  }\n\n  .chart-wrap{\n    position:relative; margin-top:10px;\n    background:var(--surface); border:2px solid var(--border); border-radius:16px;\n    box-shadow:3px 3px 0 var(--shadow-col);\n    padding:8px; height:190px;\n  }\n  #chart{ width:100%; height:100%; display:block; }\n  .momentum-badge{\n    position:absolute; top:14px; right:14px;\n    background:var(--surface-2); border:1.5px solid var(--border); border-radius:9px;\n    padding:4px 8px; font-size:11px; font-weight:700; display:none; align-items:center; gap:4px;\n  }\n\n  .quip{ margin-top:8px; font-size:12px; color:var(--ink-soft); min-height:16px; text-align:center; }\n  .position-info{\n    margin-top:6px; text-align:center; font-size:12px; font-weight:600; color:var(--ink-soft);\n    min-height:16px;\n  }\n\n  .lev-row{ display:flex; gap:7px; margin-top:12px; justify-content:center; flex-wrap:wrap; }\n  .lev-chip{\n    border:2px solid var(--border); background:var(--surface); border-radius:10px;\n    padding:6px 13px; font-weight:700; font-size:13px; cursor:pointer;\n    box-shadow:2px 2px 0 var(--shadow-col);\n  }\n  .lev-chip.active{ background:var(--gold); }\n  .lev-chip:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 var(--shadow-col); }\n\n  .action-row{ display:flex; gap:10px; margin-top:12px; }\n  .action-btn{\n    flex:1; border:2.5px solid var(--border); border-radius:16px;\n    padding:16px 10px; font-family:var(--font-display); font-weight:600; font-size:17px;\n    box-shadow:4px 4px 0 var(--shadow-col); cursor:pointer;\n    touch-action:manipulation;\n    transition:transform .06s ease, box-shadow .06s ease;\n  }\n  .action-btn:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--shadow-col); }\n  .action-btn.buy{ background:var(--green); color:#fff; }\n  .action-btn.short{ background:var(--surface); color:var(--red); border-color:var(--red); }\n  .action-btn.close{ width:100%; font-family:var(--font-mono); font-size:16px; }\n  .action-btn.close.pos{ background:var(--green-bg); color:var(--green-dark); border-color:var(--green-dark); }\n  .action-btn.close.neg{ background:var(--red-bg); color:var(--red); border-color:var(--red); }\n\n  .trade-log{ margin-top:16px; }\n  .trade-log-title{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }\n  .trade-log-row{\n    display:flex; align-items:center; gap:8px; padding:6px 0;\n    font-size:12px; border-bottom:1px solid var(--surface-2);\n  }\n  .trade-log-row .dir{ font-size:14px; }\n  .trade-log-row .tk{ flex:1; font-weight:700; }\n  .trade-log-row .pnl{ font-family:var(--font-mono); font-weight:700; }\n  .trade-log-row .pnl.pos{ color:var(--green-dark); }\n  .trade-log-row .pnl.neg{ color:var(--red); }\n\n  /* ---------- MARKETS ---------- */\n  .market-list{ display:flex; flex-direction:column; gap:10px; padding:0 18px; }\n  .market-item{\n    display:flex; align-items:center; gap:12px;\n    background:var(--surface); border:2px solid var(--border); border-radius:14px;\n    box-shadow:3px 3px 0 var(--shadow-col); padding:12px;\n    cursor:pointer; transition:transform .06s ease, box-shadow .06s ease, opacity .15s ease;\n  }\n  .market-item:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow-col); }\n  .market-item.locked{ opacity:0.5; cursor:default; }\n  .market-item.locked:active{ transform:none; box-shadow:3px 3px 0 var(--shadow-col); }\n  .market-item.selected{ background:var(--gold); }\n  .market-icon{ width:42px;height:42px;border-radius:11px; background:var(--surface-2); border:1.5px solid var(--border); display:flex;align-items:center;justify-content:center; font-size:20px; flex-shrink:0; }\n  .market-info{ flex:1; min-width:0; }\n  .market-name{ font-weight:700; font-size:14px; }\n  .market-desc{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }\n  .market-vol{ font-size:10.5px; font-weight:700; margin-top:3px; }\n  .market-lock{ font-size:11px; font-weight:700; color:var(--ink-soft); text-align:right; }\n\n  /* ---------- TOOLS (shared shop style) ---------- */\n  .section-title{ margin:18px 18px 8px; font-family:var(--font-display); font-weight:600; font-size:15px; }\n  .section-sub{ margin:-4px 18px 10px; font-size:12px; color:var(--ink-soft); }\n  .shop-list{ display:flex; flex-direction:column; gap:10px; padding:0 18px; }\n  .shop-item{\n    display:flex; align-items:center; gap:12px;\n    background:var(--surface); border:2px solid var(--border); border-radius:14px;\n    box-shadow:3px 3px 0 var(--shadow-col); padding:10px 12px;\n    cursor:pointer; transition:transform .06s ease, box-shadow .06s ease, opacity .15s ease;\n  }\n  .shop-item:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow-col); }\n  .shop-item.disabled{ opacity:0.45; cursor:default; }\n  .shop-item.disabled:active{ transform:none; box-shadow:3px 3px 0 var(--shadow-col); }\n  .shop-item.owned{ background:var(--green-bg); }\n  .shop-icon{ width:42px;height:42px;border-radius:11px; background:var(--surface-2); border:1.5px solid var(--border); display:flex;align-items:center;justify-content:center; font-size:21px; flex-shrink:0; }\n  .shop-info{ flex:1; min-width:0; }\n  .shop-name{ font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; }\n  .shop-owned{ font-size:11px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:1px 6px; color:var(--ink-soft); font-weight:700; }\n  .shop-desc{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }\n  .shop-cost{ font-family:var(--font-display); font-weight:600; font-size:14px; text-align:right; flex-shrink:0; min-width:64px; }\n\n  /* ---------- STATS ---------- */\n  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 18px 4px; }\n  .stat-box{ background:var(--surface); border:2px solid var(--border); border-radius:14px; box-shadow:3px 3px 0 var(--shadow-col); padding:10px 12px; }\n  .stat-box .k{ font-size:11px; color:var(--ink-soft); font-weight:600; }\n  .stat-box .v{ font-family:var(--font-display); font-weight:600; font-size:17px; margin-top:2px; }\n\n  .level-list{ padding:0 18px; display:flex; flex-direction:column; gap:6px; }\n  .level-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:11px; border:1.5px solid var(--border); background:var(--surface); font-size:12.5px; }\n  .level-row.locked{ opacity:0.4; }\n  .level-row.current{ background:var(--gold); }\n  .level-num{ width:26px;height:26px;border-radius:50%; background:var(--surface-2); border:1.5px solid var(--border); display:flex;align-items:center;justify-content:center; font-weight:700; font-size:11px; flex-shrink:0; }\n  .level-row.current .level-num{ background:var(--surface); }\n  .level-name{ flex:1; font-weight:700; }\n  .level-thresh{ color:var(--ink-soft); font-size:11px; }\n\n  /* ---------- Bottom nav ---------- ass=\"tabpanel\" id=\"tab-markets\">\n      <div class=\"section-title\">Markets<\/div>\n      <div class=\"section-sub\">Pick what you trade. Riskier markets unlock as you rank up.<\/div>\n      <div class=\"market-list\" id=\"marketList\"><\/div>\n    <\/div>\n\n    <!-- TOOLS -->\n    <div class=\"tabpanel\" id=\"tab-tools\">\n      <div class=\"section-title\">Trading tools<\/div>\n      <div class=\"section-sub\">Spend profit to trade bigger, cheaper, and smarter.<\/div>\n      <div class=\"shop-list\" id=\"toolList\"><\/div>\n    <\/div>\n\n    <!-- STATS -->\n    <div class=\"tabpanel\" id=\"tab-stats\">\n      <div class=\"section-title\">Your run<\/div>\n      <div class=\"stat-grid\">\n        <div class=\"stat-box\"><div class=\"k\">Total profit<\/div><div class=\"v\" id=\"statTotal\">$0<\/div><\/div>\n        <div class=\"stat-box\"><div class=\"k\">Win rate<\/div><div class=\"v\" id=\"statWin\">\u2014<\/div><\/div>\n        <div class=\"stat-box\"><div class=\"k\">Best trade<\/div><div class=\"v\" id=\"statBest\">$0<\/div><\/div>\n        <div class=\"stat-box\"><div class=\"k\">Trades made<\/div><div class=\"v\" id=\"statTrades\">0<\/div><\/div>\n      <\/div>\n      <div class=\"section-title\">Career ladder<\/div>\n      <div class=\"section-sub\">Reach a new lifetime profit total to rank up.<\/div>\n      <div class=\"level-list\" id=\"levelList\"><\/div>\n    <\/div>\n\n  <\/div>\n\n  <div class=\"bottomnav\">\n    <button class=\"navbtn active\" data-tab=\"trade\"><span class=\"ic\">\ud83d\udcc8<\/span>Trade<\/button>\n    <button class=\"navbtn\" data-tab=\"markets\"><span class=\"ic\">\ud83d\uddc2\ufe0f<\/span>Markets<\/button>\n    <button class=\"navbtn\" data-tab=\"tools\"><span class=\"ic\">\ud83d\udee0\ufe0f<\/span>Tools<\/button>\n    <button class=\"navbtn\" data-tab=\"stats\"><span class=\"ic\">\ud83c\udfc6<\/span>Stats<\/button>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n\n  <div class=\"modal-wrap\" id=\"levelModal\">\n    <div class=\"modal\">\n      <div class=\"big-emoji\">\ud83c\udf89<\/div>\n      <h2 id=\"modalTitle\">Level 2<\/h2>\n      <p id=\"modalSub\">You're now a Coffee Runner.<\/p>\n      <button id=\"modalClose\">Back to trading<\/button>\n    <\/div>\n  <\/div>\n\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var SAVE_KEY = \"trade_up_save_v2\";\n  var TICK_MS = 120;\n\n  // ---------- Career ladder ----------\n  var levelTitles = [\n    \"Broke Intern\",\"Coffee Runner\",\"Spreadsheet Jockey\",\"Junior Analyst\",\"Chart Watcher\",\n    \"Candlestick Reader\",\"Margin Caller\",\"Day Trader (Trainee)\",\"Options Dabbler\",\"Bull Market Believer\",\n    \"Bear Market Survivor\",\"Technical Analyst\",\"Swing Trader\",\"Leverage Enthusiast\",\"Portfolio Manager\",\n    \"Risk Taker\",\"Market Maker\",\"Algo Tinkerer\",\"Quant Wannabe\",\"Senior Trader\",\n    \"Fund Associate\",\"VP of Vibes\",\"Managing Director\",\"Hedge Fund Analyst\",\"Arbitrage Artist\",\n    \"Derivatives Dealer\",\"Market Whisperer\",\"Day Trader (Legendary)\",\"Wall Street Regular\",\"Institutional Investor\",\n    \"Private Equity Partner\",\"Central Bank Consultant\",\"Market Mover\",\"Billionaire Bro\",\"Fed Whisperer\",\n    \"Economic Singularity\",\"Post-Scarcity Trader\",\"Owns The Stock Market\",\"Simulation Glitch\",\"The Last Trade\"\n  ];\n  var thresholds = [0];\n  for (var i=1;i<levelTitles.length;i++){ thresholds.push(Math.floor(40*Math.pow(1.5,i))); }\n\n  // ---------- Markets ----------\n  var tickers = {\n    SAFE: {symbol:\"SAFE\", name:\"Gov Bond ETF\",  icon:\"\ud83c\udfdb\ufe0f\", base:50,  vol:0.16, drift:0.03, newsMin:15000, newsMax:24000, newsMag:[0.004,0.012], unlock:1, volLabel:\"Low risk\"},\n    TRDY: {symbol:\"TRDY\", name:\"TrendyCo\",      icon:\"\ud83c\udfe2\", base:100, vol:0.55, drift:0.12, newsMin:9000,  newsMax:16000, newsMag:[0.018,0.045], unlock:1, volLabel:\"Medium risk\"},\n    TECH: {symbol:\"TECH\", name:\"NovaTech\",      icon:\"\ud83d\udcbb\", base:200, vol:1.05, drift:0.25, newsMin:7000,  newsMax:13000, newsMag:[0.03,0.075],  unlock:6, volLabel:\"High risk\"},\n    MEME: {symbol:\"MEME\", name:\"Rocket Doge\",   icon:\"\ud83d\ude80\", base:20,  vol:2.1,  drift:0.5,  newsMin:5000,  newsMax:10000, newsMag:[0.06,0.14],   unlock:14, volLabel:\"Extreme risk\"}\n  };\n  var tickerOrder = [\"SAFE\",\"TRDY\",\"TECH\",\"MEME\"];\n\n  var newsPos = [\"Earnings beat expectations\", \"Major partnership announced\", \"Analyst upgrade incoming\", \"Buyback program revealed\", \"Demand is through the roof\"];\n  var newsNeg = [\"CEO resigns unexpectedly\", \"Regulator opens an inquiry\", \"Missed earnings estimates\", \"Recall issued for flagship product\", \"Analyst downgrade incoming\"];\n\n  var quips = [\n    \"Cut losses early. Let winners run.\",\n    \"The trend is your friend, until it isn't.\",\n    \"This is not financial advice.\",\n    \"Plans are nothing. Timing is everything.\",\n    \"Nobody rings a bell at the top.\",\n    \"Patience is a position too.\",\n    \"React to the market, don't predict it.\",\n    \"Small losses beat big regrets.\"\n  ];\n\n  // ---------- Tools ----------\n  var toolsData = [\n    {key:\"trend\",    type:\"single\",     icon:\"\ud83d\udcc9\", name:\"Trend Line\",       desc:\"Overlay a moving average to spot the trend.\", cost:150},\n    {key:\"short\",    type:\"single\",     icon:\"\ud83e\ude73\", name:\"Short License\",    desc:\"Bet on prices falling, not just rising.\",     cost:500},\n    {key:\"momentum\", type:\"single\",     icon:\"\ud83e\udded\", name:\"Momentum Meter\",   desc:\"See if the last few seconds trended up or down.\", cost:900},\n    {key:\"bankroll\", type:\"repeatable\", icon:\"\ud83d\udcbc\", name:\"Bigger Bankroll\",  desc:\"+$5 position size per trade.\", baseCost:20},\n    {key:\"fee\",      type:\"repeatable\", icon:\"\ud83c\udff7\ufe0f\", name:\"Discount Broker\", desc:\"Cut your trading fee.\", baseCost:150, max:5},\n    {key:\"lev2\",     type:\"single\",     icon:\"2\ufe0f\u20e3\", name:\"2\u00d7 Leverage\",     desc:\"Unlock double exposure on every trade.\", cost:350},\n    {key:\"lev3\",     type:\"single\",     icon:\"3\ufe0f\u20e3\", name:\"3\u00d7 Leverage\",     desc:\"Unlock triple exposure.\", cost:1600, requires:\"lev2\"},\n    {key:\"lev5\",     type:\"single\",     icon:\"5\ufe0f\u20e3\", name:\"5\u00d7 Leverage\",     desc:\"Serious exposure for serious traders.\", cost:8000, requires:\"lev3\"},\n    {key:\"lev10\",    type:\"single\",     icon:\"\ud83d\udd1f\", name:\"10\u00d7 Leverage\",    desc:\"One bad trade can wipe you out.\", cost:38000, requires:\"lev5\"}\n  ];\n\n  // ---------- State ----------\n  var state = {\n    money: 100,\n    totalEarned: 0,\n    trades: 0,\n    wins: 0,\n    bestTrade: 0,\n    startTime: Date.now(),\n    seenLevel: 1,\n    selectedTicker: \"TRDY\",\n    leverage: 1,\n    streak: 0,\n    tools: { trend:false, short:false, momentum:false, bankroll:0, fee:0, lev2:false, lev3:false, lev5:false, lev10:false },\n    position: null,\n    recentTrades: []\n  };\n\n  // transient per-ticker simulation, not saved\n  var sim = {};\n\n  function fmt(num){\n    var neg = num < 0; var n = Math.abs(num); var out;\n    if (n < 1000){ out = n.toFixed(n < 10 ? 2 : 1).replace(/\\.0$/, \"\"); }\n    else {\n      var units = [\"K\",\"M\",\"B\",\"T\",\"Qa\",\"Qi\",\"Sx\",\"Sp\",\"Oc\",\"No\",\"Dc\"];\n      var u = -1;\n      while (n >= 1000 && u < units.length - 1){ n /= 1000; u++; }\n      out = n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + units[u];\n    }\n    return (neg ? \"-\" : \"\") + out;\n  }\n  function money(num){ return \"$\" + fmt(num); }\n  function moneySigned(num){ return (num>=0?\"+\":\"-\") + \"$\" + fmt(Math.abs(num)); }\n  function rand(a,b){ return a + Math.random()*(b-a); }\n  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }\n  function costFor(base, owned){ return Math.ceil(base * Math.pow(1.15, owned)); }\n\n  function getLevel(total){\n    var lvl = 1;\n    for (var i=1;i<thresholds.length;i++){ if (total >= thresholds[i]) lvl = i+1; else break; }\n    return lvl;\n  }\n  function unlockedTickers(){\n    var lvl = getLevel(state.totalEarned);\n    var out = [];\n    tickerOrder.forEach(function(k){ if (tickers[k].unlock <= lvl) out.push(k); });\n    return out;\n  }\n  function availableLeverage(){\n    var out = [1];\n    if (state.tools.lev2) out.push(2);\n    if (state.tools.lev3) out.push(3);\n    if (state.tools.lev5) out.push(5);\n    if (state.tools.lev10) out.push(10);\n    return out;\n  }\n  function baseSize(){ return 10 + state.tools.bankroll*5; }\n  function feeRate(){ return Math.max(0.001, 0.006 - state.tools.fee*0.001); }\n\n  // ---------- DOM ----------\n  var $ = function(id){ return document.getElementById(id); };\n  var canvas = $(\"chart\");\n  var ctx = canvas.getContext(\"2d\");\n\n  function ensureSim(key){\n    if (sim[key]) return sim[key];\n    var cfg = tickers[key];\n    sim[key] = {\n      price: cfg.base,\n      drift: 0,\n      history: [cfg.base],\n      nextNewsAt: Date.now() + rand(cfg.newsMin, cfg.newsMax),\n      pendingNews: null,\n      openIndex: -1\n    };\n    return sim[key];\n  }\n\n  function tickSim(key){\n    var cfg = tickers[key];\n    var s = ensureSim(key);\n    s.drift += (Math.random()-0.5) * 0.03 * cfg.vol;\n    if (s.drift > cfg.drift) s.drift = cfg.drift;\n    if (s.drift < -cfg.drift) s.drift = -cfg.drift;\n    var noise = (Math.random()-0.5) * cfg.vol;\n    var pct = (s.drift + noise) / 100;\n    s.price = Math.max(cfg.base*0.1, s.price * (1+pct));\n    s.history.push(s.price);\n    if (s.history.length > 90) s.history.shift();\n\n    var now = Date.now();\n    if (!s.pendingNews && now > s.nextNewsAt){\n      var dir = Math.random() < 0.5 ? -1 : 1;\n      var headline = dir > 0 ? pick(newsPos) : pick(newsNeg);\n      s.pendingNews = { dir: dir, executeAt: now + 1300 };\n      if (key === state.selectedTicker) showToast(\"\ud83d\udea8 \" + cfg.symbol + \": \" + headline);\n    }\n    if (s.pendingNews && now >= s.pendingNews.executeAt){\n      var flip = Math.random() < 0.15;\n      var actual = flip ? -s.pendingNews.dir : s.pendingNews.dir;\n      var mag = rand(cfg.newsMag[0], cfg.newsMag[1]);\n      s.price = Math.max(cfg.base*0.1, s.price * (1 + actual*mag));\n      s.history.push(s.price);\n      if (s.history.length > 90) s.history.shift();\n      if (key === state.selectedTicker) showToast(actual > 0 ? \"\ud83d\udcc8 Price jumped!\" : \"\ud83d\udcc9 Price dropped!\");\n      s.pendingNews = null;\n      s.nextNewsAt = now + rand(cfg.newsMin, cfg.newsMax);\n    }\n  }\n\n  // ---------- Chart ----------\n  function drawChart(){\n    var key = state.selectedTicker;\n    var s = ensureSim(key);\n    var hist = s.history;\n    var dpr = window.devicePixelRatio || 1;\n    var rect = canvas.getBoundingClientRect();\n    var w = Math.max(1, rect.width), h = Math.max(1, rect.height);\n    if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){\n      canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);\n    }\n    ctx.setTransform(dpr,0,0,dpr,0,0);\n    ctx.clearRect(0,0,w,h);\n\n    var vals = hist.slice();\n    var pos = state.position;\n    if (pos && pos.ticker === key) vals = vals.concat([pos.entryPrice]);\n    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);\n    if (min === max){ min -= 1; max += 1; }\n    var pad = (max-min) * 0.12;\n    min -= pad; max += pad;\n\n    function xAt(i){ return (i/(hist.length-1)) * w; }\n    function yAt(v){ return h - ((v-min)/(max-min)) * h; }\n\n    // position entry line + fill\n    if (pos && pos.ticker === key && s.openIndex >= 0){\n      var ey = yAt(pos.entryPrice);\n      var startIdx = Math.min(s.openIndex, hist.length-1);\n      var profitNow = pos.direction === \"short\" ? (pos.entryPrice - hist[hist.length-1]) : (hist[hist.length-1] - pos.entryPrice);\n      var fillColor = profitNow >= 0 ? getVar(\"--green-bg\") : getVar(\"--red-bg\");\n      ctx.beginPath();\n      ctx.moveTo(xAt(startIdx), ey);\n      for (var i=startIdx;i<hist.length;i++){ ctx.lineTo(xAt(i), yAt(hist[i])); }\n      ctx.lineTo(xAt(hist.length-1), ey);\n      ctx.closePath();\n      ctx.fillStyle = fillColor;\n      ctx.fill();\n\n      ctx.setLineDash([4,4]);\n      ctx.strokeStyle = getVar(\"--ink-soft\");\n      ctx.lineWidth = 1.5;\n      ctx.beginPath(); ctx.moveTo(0, ey); ctx.lineTo(w, ey); ctx.stroke();\n      ctx.setLineDash([]);\n    }\n\n    // trend line (SMA)\n    if (state.tools.trend && hist.length > 6){\n      var win = 8;\n      ctx.strokeStyle = getVar(\"--gold-dark\");\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      for (var j=0;j<hist.length;j++){\n        var lo = Math.max(0, j-win+1);\n        var sum = 0, cnt = 0;\n        for (var k=lo;k<=j;k++){ sum += hist[k]; cnt++; }\n        var avg = sum/cnt;\n        var px = xAt(j), py = yAt(avg);\n        if (j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);\n      }\n      ctx.stroke();\n    }\n\n    // price line\n    ctx.strokeStyle = getVar(\"--green-dark\");\n    ctx.lineWidth = 2.5;\n    ctx.lineJoin = \"round\"; ctx.lineCap = \"round\";\n    ctx.beginPath();\n    for (var m=0;m<hist.length;m++){\n      var px2 = xAt(m), py2 = yAt(hist[m]);\n      if (m===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2);\n    }\n    ctx.stroke();\n\n    // current price dot\n    var lastX = xAt(hist.length-1), lastY = yAt(hist[hist.length-1]);\n    ctx.fillStyle = getVar(\"--green-dark\");\n    ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, Math.PI*2); ctx.fill();\n  }\n  var cssVarCache = {};\n  function getVar(name){\n    if (!cssVarCache[name]) cssVarCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim();\n    return cssVarCache[name];\n  }\n  window.addEventListener(\"resize\", function(){ cssVarCache = {}; drawChart(); });\n\n  // ---------- Render ----------\n  function renderTickerHead(){\n    var cfg = tickers[state.selectedTicker];\n    var s = ensureSim(state.selectedTicker);\n    $(\"tickerName\").innerHTML = cfg.name + ' <span class=\"sym\">' + cfg.symbol + '<\/span>';\n    $(\"priceValue\").textContent = \"$\" + s.price.toFixed(2);\n    var startPrice = s.history[0];\n    var chg = ((s.price - startPrice)/startPrice)*100;\n    var chEl = $(\"priceChange\");\n    chEl.textContent = (chg>=0?\"+\":\"\") + chg.toFixed(2) + \"%\";\n    chEl.className = \"price-change \" + (chg>=0 ? \"up\" : \"down\");\n\n    if (state.tools.momentum && s.history.length > 8){\n      var recent = s.history[s.history.length-1] - s.history[s.history.length-9];\n      var badge = $(\"momentumBadge\");\n      badge.style.display = \"flex\";\n      badge.innerHTML = recent >= 0 ? \"\u25b2 rising\" : \"\u25bc falling\";\n      badge.style.color = recent >= 0 ? getVar(\"--green-dark\") : getVar(\"--red\");\n    } else {\n      $(\"momentumBadge\").style.display = \"none\";\n    }\n  }\n\n  function renderStreak(){\n    var el = $(\"streakBadge\");\n    if (state.streak >= 2){ el.style.display = \"inline-flex\"; el.textContent = \"\ud83d\udd25 \" + state.streak + \" win streak\"; }\n    else { el.style.display = \"none\"; }\n  }\n\n  function renderLevRow(){\n    var row = $(\"levRow\");\n    if (state.position){ row.innerHTML = \"\"; row.style.display = \"none\"; return; }\n    row.style.display = \"flex\";\n    var levs = availableLeverage();\n    if (levs.indexOf(state.leverage) === -1) state.leverage = 1;\n    row.innerHTML = \"\";\n    levs.forEach(function(l){\n      var chip = document.createElement(\"button\");\n      chip.className = \"lev-chip\" + (state.leverage === l ? \" active\" : \"\");\n      chip.textContent = l + \"\u00d7\";\n      chip.addEventListener(\"click\", function(){ state.leverage = l; renderLevRow(); });\n      row.appendChild(chip);\n    });\n  }\n\n  function renderActionRow(){\n    var buyBtn = $(\"buyBtn\"), shortBtn = $(\"shortBtn\"), closeBtn = $(\"closeBtn\");\n    if (state.position){\n      buyBtn.style.display = \"none\"; shortBtn.style.display = \"none\";\n      closeBtn.style.display = \"block\";\n      var pos = state.position;\n      var s = ensureSim(pos.ticker);\n      var pct = (s.price - pos.entryPrice)/pos.entryPrice;\n      if (pos.direction === \"short\") pct = -pct;\n      var gross = pos.size * pos.leverage * pct;\n      var fee = pos.size * pos.leverage * feeRate();\n      var net = gross - fee;\n      closeBtn.textContent = \"Close  \" + moneySigned(net);\n      closeBtn.className = \"action-btn close \" + (net >= 0 ? \"pos\" : \"neg\");\n\n      $(\"positionInfo\").textContent = (pos.direction === \"long\" ? \"LONG\" : \"SHORT\") + \" @ $\" + pos.entryPrice.toFixed(2) +\n        \" \u00b7 size \" + money(pos.size) + \" \u00b7 \" + pos.leverage + \"\u00d7\";\n    } else {\n      buyBtn.style.display = \"block\";\n      shortBtn.style.display = state.tools.short ? \"block\" : \"none\";\n      closeBtn.style.display = \"none\";\n      $(\"positionInfo\").textContent = \"\";\n    }\n  }\n\n  function renderTradeLog(){\n    var el = $(\"tradeLog\");\n    if (!state.recentTrades.length){ el.innerHTML = '<div class=\"quip\">No trades yet. Open a position above.<\/div>'; return; }\n    el.innerHTML = \"\";\n    state.recentTrades.forEach(function(t){\n      var row = document.createElement(\"div\");\n      row.className = \"trade-log-row\";\n      row.innerHTML =\n        '<span class=\"dir\">' + (t.direction === \"long\" ? \"\u25b2\" : \"\u25bc\") + '<\/span>' +\n        '<span class=\"tk\">' + t.ticker + '<\/span>' +\n        '<span class=\"pnl ' + (t.pnl>=0?\"pos\":\"neg\") + '\">' + moneySigned(t.pnl) + '<\/span>';\n      el.appendChild(row);\n    });\n  }\n\n  function renderMarkets(){\n    var el = $(\"marketList\");\n    el.innerHTML = \"\";\n    var lvl = getLevel(state.totalEarned);\n    tickerOrder.forEach(function(key){\n      var cfg = tickers[key];\n      var locked = cfg.unlock > lvl;\n      var row = document.createElement(\"div\");\n      row.className = \"market-item\" + (locked ? \" locked\" : \"\") + (state.selectedTicker === key && !locked ? \" selected\" : \"\");\n      row.innerHTML =\n        '<div class=\"market-icon\">' + cfg.icon + '<\/div>' +\n        '<div class=\"market-info\">' +\n          '<div class=\"market-name\">' + cfg.name + ' <span style=\"color:var(--ink-soft);font-weight:600;font-size:11.5px;\">' + cfg.symbol + '<\/span><\/div>' +\n          '<div class=\"market-desc\">' + (locked ? \"Unlocks at Level \" + cfg.unlock : \"Tap to trade this market\") + '<\/div>' +\n          '<div class=\"market-vol\">' + cfg.volLabel + '<\/div>' +\n        '<\/div>';\n      if (!locked){\n        row.addEventListener(\"click\", function(){\n          if (state.position){ showToast(\"Close your open position first\"); return; }\n          state.selectedTicker = key;\n          renderMarkets();\n          switchTab(\"trade\");\n          save();\n        });\n      }\n      el.appendChild(row);\n    });\n  }\n\n  function renderTools(){\n    var el = $(\"toolList\");\n    el.innerHTML = \"\";\n    toolsData.forEach(function(t){\n      var row = document.createElement(\"div\");\n      var owned = t.type === \"single\" ? !!state.tools[t.key] : state.tools[t.key];\n      var maxed = t.type === \"repeatable\" && t.max && owned >= t.max;\n      var lockedByReq = t.requires && !state.tools[t.requires];\n      var cls = \"shop-item\";\n      var costText;\n      if (t.type === \"single\"){\n        if (owned){ cls += \" owned\"; costText = \"Owned\"; }\n        else if (lockedByReq){ cls += \" disabled\"; costText = \"Locked\"; }\n        else { costText = money(t.cost); if (state.money < t.cost) cls += \" disabled\"; }\n      } else {\n        if (maxed){ cls += \" owned\"; costText = \"Maxed\"; }\n        else {\n          var c = costFor(t.baseCost, owned);\n          costText = money(c);\n          if (state.money < c) cls += \" disabled\";\n        }\n      }\n      row.className = cls;\n      var descExtra = lockedByReq ? \" Requires \" + toolsData.filter(function(x){return x.key===t.requires;})[0].name + \" first.\" : \"\";\n      row.innerHTML =\n        '<div class=\"shop-icon\">' + t.icon + '<\/div>' +\n        '<div class=\"shop-info\">' +\n          '<div class=\"shop-name\">' + t.name + (t.type===\"repeatable\" && owned ? '<span class=\"shop-owned\">x' + owned + '<\/span>' : '') + '<\/div>' +\n          '<div class=\"shop-desc\">' + t.desc + descExtra + '<\/div>' +\n        '<\/div>' +\n        '<div class=\"shop-cost\">' + costText + '<\/div>';\n      if (!(owned && t.type===\"single\") && !maxed && !lockedByReq){\n        row.addEventListener(\"click\", function(){ buyTool(t); });\n      }\n      el.appendChild(row);\n    });\n  }\n\n  function buyTool(t){\n    if (t.type === \"single\"){\n      if (state.tools[t.key] || state.money < t.cost) return;\n      state.money -= t.cost;\n      state.tools[t.key] = true;\n    } else {\n      if (t.max && state.tools[t.key] >= t.max) return;\n      var c = costFor(t.baseCost, state.tools[t.key]);\n      if (state.money < c) return;\n      state.money -= c;\n      state.tools[t.key]++;\n    }\n    renderTools(); renderHeader(); renderActionRow(); renderLevRow(); save();\n  }\n\n  function renderLevelList(){\n    var container = $(\"levelList\");\n    container.innerHTML = \"\";\n    var currentLvl = getLevel(state.totalEarned);\n    levelTitles.forEach(function(title, idx){\n      var lvlNo = idx+1;\n      var row = document.createElement(\"div\");\n      var cls = \"level-row\";\n      if (lvlNo === currentLvl) cls += \" current\"; else if (lvlNo > currentLvl) cls += \" locked\";\n      row.className = cls;\n      row.innerHTML =\n        '<div class=\"level-num\">' + lvlNo + '<\/div>' +\n        '<div class=\"level-name\">' + title + '<\/div>' +\n        '<div class=\"level-thresh\">' + (idx===0 ? \"Start\" : money(thresholds[idx])) + '<\/div>';\n      container.appendChild(row);\n    });\n  }\n\n  function renderHeader(){\n    var lvl = getLevel(state.totalEarned);\n    var idx = lvl - 1;\n    $(\"levelNum\").textContent = lvl;\n    $(\"levelTitle\").textContent = levelTitles[idx] || levelTitles[levelTitles.length-1];\n    if (idx < thresholds.length - 1){\n      var cur = thresholds[idx], next = thresholds[idx+1];\n      var pct = Math.max(0, Math.min(100, ((state.totalEarned - cur) / (next - cur)) * 100));\n      $(\"progressFill\").style.width = pct.toFixed(1) + \"%\";\n      $(\"levelPct\").textContent = Math.floor(pct) + \"%\";\n    } else {\n      $(\"progressFill\").style.width = \"100%\";\n      $(\"levelPct\").textContent = \"MAX\";\n    }\n  }\n\n  function updateStats(){\n    $(\"statTotal\").textContent = money(state.totalEarned);\n    $(\"statWin\").textContent = state.trades ? Math.round((state.wins/state.trades)*100) + \"%\" : \"\u2014\";\n    $(\"statBest\").textContent = money(state.bestTrade);\n    $(\"statTrades\").textContent = fmt(state.trades);\n  }\n\n  function renderAll(){\n    renderTickerHead(); renderStreak(); renderLevRow(); renderActionRow();\n    renderTradeLog(); renderHeader(); drawChart();\n  }\n\n  // ---------- Actions ----------\n  function openPosition(direction){\n    if (state.position) return;\n    if (direction === \"short\" && !state.tools.short) return;\n    var s = ensureSim(state.selectedTicker);\n    state.position = {\n      ticker: state.selectedTicker, direction: direction,\n      entryPrice: s.price, size: baseSize(), leverage: state.leverage,\n      openTime: Date.now()\n    };\n    s.openIndex = s.history.length - 1;\n    renderActionRow(); renderLevRow(); drawChart(); save();\n  }\n\n  function closePosition(){\n    var pos = state.position; if (!pos) return;\n    var s = ensureSim(pos.ticker);\n    var pct = (s.price - pos.entryPrice)/pos.entryPrice;\n    if (pos.direction === \"short\") pct = -pct;\n    var gross = pos.size * pos.leverage * pct;\n    var fee = pos.size * pos.leverage * feeRate();\n    var net = gross - fee;\n\n    state.money = Math.max(0, state.money + net);\n    if (net > 0){ state.totalEarned += net; state.streak++; } else { state.streak = 0; }\n    state.trades++;\n    if (net > 0) state.wins++;\n    if (net > state.bestTrade) state.bestTrade = net;\n\n    state.recentTrades.unshift({ ticker: pos.ticker, pnl: net, direction: pos.direction, time: Date.now() });\n    if (state.recentTrades.length > 6) state.recentTrades.pop();\n\n    state.position = null;\n    if (navigator.vibrate){ try{ navigator.vibrate(net>=0 ? 10 : [10,30,10]); }catch(e){} }\n\n    renderAll(); checkLevelUp(); save();\n  }\n\n  $(\"buyBtn\").addEventListener(\"click\", function(){ openPosition(\"long\"); });\n  $(\"shortBtn\").addEventListener(\"click\", function(){ openPosition(\"short\"); });\n  $(\"closeBtn\").addEventListener(\"click\", closePosition);\n\n  var levelModal = $(\"levelModal\");\n  function checkLevelUp(){\n    var lvl = getLevel(state.totalEarned);\n    if (lvl > state.seenLevel){\n      state.seenLevel = lvl;\n      $(\"modalTitle\").textContent = \"Level \" + lvl;\n      $(\"modalSub\").textContent = \"You're now a \" + levelTitles[lvl-1] + \".\";\n      levelModal.classList.add(\"show\");\n      save();\n    }\n  }\n  $(\"modalClose\").addEventListener(\"click\", function(){ levelModal.classList.remove(\"show\"); });\n\n  var toastEl = $(\"toast\");\n  function showToast(text){\n    toastEl.textContent = text;\n    toastEl.classList.add(\"show\");\n    clearTimeout(showToast._t);\n    showToast._t = setTimeout(function(){ toastEl.classList.remove(\"show\"); }, 2400);\n  }\n\n  var quipTimer = null;\n  function rotateQuip(){ if (!state.position) $(\"quip\").textContent = pick(quips); }\n\n  // ---------- Tabs ----------\n  var navBtns = document.querySelectorAll(\".navbtn\");\n  function switchTab(name){\n    navBtns.forEach(function(b){ b.classList.toggle(\"active\", b.dataset.tab === name); });\n    document.querySelectorAll(\".tabpanel\").forEach(function(p){ p.classList.remove(\"active\"); });\n    $(\"tab-\" + name).classList.add(\"active\");\n    if (name === \"markets\") renderMarkets();\n    if (name === \"tools\") renderTools();\n    if (name === \"stats\") { renderLevelList(); updateStats(); }\n    if (name === \"trade\") setTimeout(drawChart, 30);\n    $(\"main\").scrollTop = 0;\n  }\n  navBtns.forEach(function(btn){ btn.addEventListener(\"click\", function(){ switchTab(btn.dataset.tab); }); });\n\n  $(\"resetBtn\").addEventListener(\"click\", function(){\n    if (confirm(\"Reset all progress? This can't be undone.\")){\n      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}\n      state = {\n        money: 100, totalEarned: 0, trades: 0, wins: 0, bestTrade: 0, startTime: Date.now(),\n        seenLevel: 1, selectedTicker: \"TRDY\", leverage: 1, streak: 0,\n        tools: { trend:false, short:false, momentum:false, bankroll:0, fee:0, lev2:false, lev3:false, lev5:false, lev10:false },\n        position: null, recentTrades: []\n      };\n      sim = {};\n      renderAll(); renderMarkets(); renderTools(); renderLevelList(); updateStats();\n    }\n  });\n\n  // ---------- Save / load ----------\n  function save(){\n    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}\n  }\n  function load(){\n    try{\n      var raw = localStorage.getItem(SAVE_KEY);\n      if (!raw) return;\n      var d = JSON.parse(raw);\n      if (!d || typeof d !== \"object\") return;\n      state.money = typeof d.money === \"number\" ? d.money : 100;\n      state.totalEarned = typeof d.totalEarned === \"number\" ? d.totalEarned : 0;\n      state.trades = typeof d.trades === \"number\" ? d.trades : 0;\n      state.wins = typeof d.wins === \"number\" ? d.wins : 0;\n      state.bestTrade = typeof d.bestTrade === \"number\" ? d.bestTrade : 0;\n      state.startTime = typeof d.startTime === \"number\" ? d.startTime : Date.now();\n
