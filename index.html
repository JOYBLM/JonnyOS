1px solid var(--panel-line);\n    color: var(--text);\n    font-family: var(--font-body); font-weight: 600;\n    padding: 10px 18px; border-radius: 8px; cursor: pointer;\n  }\n  .side-btn.selected{ border-color: var(--gold); color: var(--gold); }\n\n  /* ---------- Dice ---------- */\n  .dice-visual{\n    display:flex; align-items:center; gap: 24px; margin-bottom: 20px; flex-wrap: wrap;\n  }\n  .dice-track{\n    position: relative; flex: 1; min-width: 260px;\n    height: 46px; border-radius: 8px;\n    background: linear-gradient(90deg, var(--pink), var(--panel-alt) 50%, var(--teal));\n  }\n  .dice-marker{\n    position:absolute; top:-8px;\n    width: 3px; height: 62px; background: var(--text);\n    transform: translateX(-50%);\n  }\n  .dice-roll-marker{\n    position:absolute; top:-14px;\n    width: 4px; height: 74px; background: var(--gold);\n    box-shadow: 0 0 10px var(--gold);\n    transform: translateX(-50%);\n    transition: left .5s ease-out;\n  }\n  .dice-readout{ font-family: var(--font-display); font-size: 30px; color: var(--gold); min-width: 70px; text-align:center; }\n  .toggle-row{ display:flex; gap:10px; }\n  .toggle-btn{\n    background: var(--panel-alt); border: 1px solid var(--panel-line);\n    color: var(--text); font-family: var(--font-body); font-weight:600;\n    padding: 9px 16px; border-radius: 8px; cursor:pointer;\n  }\n  .toggle-btn.selected{ border-color: var(--teal); color: var(--teal); }\n  .stat-row{ display:flex; gap: 26px; margin-top: 18px; flex-wrap: wrap; }\n  .stat{ font-size: 12px; color: var(--text-muted); }\n  .stat b{ display:block; font-size: 16px; color: var(--text); font-family: var(--font-body); }\n\n  /* ---------- Slots ---------- */\n  .reels{\n    display:flex; gap: 12px; margin-bottom: 22px;\n  }\n  .reel{\n    width: 90px; height: 100px;\n    background: var(--bg-deep);\n    border: 1px solid var(--panel-line);\n    border-radius: 10px;\n    display:flex; align-items:center; justify-content:center;\n    font-size: 44px;\n    overflow: hidden;\n  }\n  .reel.spinning span{ animation: spin-symbols .12s linear infinite; }\n  @keyframes spin-symbols{\n    0%{ transform: translateY(0); }\n    100%{ transform: translateY(-8px); }\n  }\n  .payline{\n    font-size: 12px; color: var(--text-muted); margin-top: -8px; margin-bottom: 18px;\n  }\n\n  /* ---------- Crash ---------- */\n  .crash-wrap{ display:flex; flex-direction: column; gap: 18px; }\n  .crash-canvas-area{\n    position: relative;\n    height: 220px;\n    background: var(--bg-deep);\n    border: 1px solid var(--panel-line);\n    border-radius: 10px;\n    overflow: hidden;\n  }\n  .crash-multiplier{\n    position:absolute; top:16px; left:20px;\n    font-family: var(--font-display);\n    font-size: 46px;\n    color: var(--teal);\n    text-shadow: 0 0 20px rgba(38,229,200,0.4);\n  }\n  .crash-multiplier.busted{ color: var(--pink); text-shadow: 0 0 20px rgba(255,61,110,0.5); }\n  .crash-line{\n    position:absolute; left:0; bottom:0;\n    width: 4px; background: var(--teal);\n    box-shadow: 0 0 12px var(--teal);\n    transition: height .08s linear, width .08s linear;\n  }\n  .crash-actions{ display:flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }\n  .cashout-btn{\n    font-family: var(--font-display); font-size: 18px; letter-spacing:1px;\n    background: var(--gold); color: var(--bg-deep); border:none;\n    padding: 12px 28px; border-radius: 9px; cursor:pointer;\n  }\n  .cashout-btn:disabled{ background: var(--panel-alt); color: var(--text-muted); cursor:not-allowed; }\n\n  /* ---------- Mines ---------- */\n  .mines-wrap{ display:flex; gap: 30px; flex-wrap: wrap; }\n  .mines-grid{\n    display:grid;\n    grid-template-columns: repeat(5, 56px);\n    grid-template-rows: repeat(5, 56px);\n    gap: 8px;\n  }\n  .mine-tile{\n    width:56px; height:56px;\n    background: var(--panel-alt);\n    border: 1px solid var(--panel-line);\n    border-radius: 8px;\n    display:flex; align-items:center; justify-content:center;\n    font-size: 22px;\n    cursor: pointer;\n    transition: background .12s, border-color .12s, transform .08s;\n  }\n  .mine-tile:hover:not(.revealed):not(.disabled){ border-color: var(--teal); transform: translateY(-1px); }\n  .mine-tile.revealed.safe{ background: rgba(38,229,200,0.15); border-color: var(--teal); cursor:default; }\n  .mine-tile.revealed.bomb{ background: rgba(255,61,110,0.2); border-color: var(--pink); cursor:default; }\n  .mine-tile.disabled{ cursor: default; opacity: .85; }\n  .mines-side{ display:flex; flex-direction: column; gap: 16px; min-width: 200px; }\n  .mines-field{ display:flex; flex-direction:column; gap:6px; }\n  .mines-field label{ font-size: 11px; color: var(--text-muted); letter-spacing:0.4px; }\n  .mines-field select{\n    background: var(--bg-deep); border: 1px solid var(--panel-line); color: var(--text);\n    font-family: var(--font-body); font-weight:600; font-size:14px;\n    padding: 9px 10px; border-radius: 8px;\n  }\n  .mines-stat b{ display:block; font-size: 18px; color: var(--gold); font-family: var(--font-body); }\n  .mines-stat{ font-size:12px; color: var(--text-muted); }\n\n  /* ---------- Roulette ---------- */\n  .roulette-wrap{ display:flex; gap: 34px; flex-wrap: wrap; align-items:center; }\n  .wheel-frame{\n    width: 190px; height: 190px; border-radius: 50%;\n    position: relative;\n    border: 6px solid var(--panel-line);\n    box-shadow: 0 0 30px rgba(0,0,0,0.5) inset;\n    overflow: hidden;\n  }\n  .wheel-disc{\n    width:100%; height:100%; border-radius:50%;\n    background: conic-gradient(\n      var(--pink) 0deg 24deg, var(--bg-deep) 24deg 48deg,\n      var(--pink) 48deg 72deg, var(--bg-deep) 72deg 96deg,\n      var(--pink) 96deg 120deg, var(--bg-deep) 120deg 144deg,\n      var(--pink) 144deg 168deg, var(--bg-deep) 168deg 192deg,\n      var(--pink) 192deg 216deg, var(--bg-deep) 216deg 240deg,\n      var(--pink) 240deg 264deg, var(--bg-deep) 264deg 288deg,\n      var(--pink) 288deg 312deg, var(--bg-deep) 312deg 336deg,\n      var(--pink) 336deg 349deg, var(--teal) 349deg 360deg\n    );\n    transition: transform 3.2s cubic-bezier(.15,.7,.15,1);\n    display:flex; align-items:center; justify-content:center;\n  }\n  .wheel-disc .wheel-center{\n    width: 60px; height:60px; border-radius:50%;\n    background: var(--panel);\n    display:flex; align-items:center; justify-content:center;\n    font-family: var(--font-display); font-size:22px; color: var(--gold);\n  }\n  .wheel-pin{\n    position:absolute; top:-2px; left:50%; transform: translateX(-50%);\n    width:0; height:0;\n    border-left: 8px solid transparent; border-right: 8px solid transparent;\n    border-top: 14px solid var(--gold);\n    z-index: 2;\n  }\n  .roulette-side{ display:flex; flex-direction:column; gap:16px; min-width:220px; }\n  .bet-grid{ display:flex; gap:8px; flex-wrap: wrap; }\n  .rbet-btn{\n    background: var(--panel-alt); border: 1px solid var(--panel-line);\n    color: var(--text); font-family: var(--font-body); font-weight:600; font-size:13px;\n    padding: 9px 14px; border-radius: 8px; cursor:pointer;\n  }\n  .rbet-btn.selected{ border-color: var(--gold); color: var(--gold); }\n  .rbet-btn[data-color=\"red\"].selected{ border-color: var(--pink); color: var(--pink); }\n  .rbet-btn[data-color=\"green\"].selected{ border-color: var(--teal); color: var(--teal); }\n\n  footer{\n    max-width: 1000px; margin: 30px auto 40px; padding: 0 20px;\n    font-size: 11px; color: var(--text-muted); text-align:center;\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    .coin.flipping{ animation: none; }\n    .reel.spinning span{ animation: none; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <div class=\"header-inner\">\n    <div>\n      <div class=\"logo\">FAKE<span>STAKE<\/span><\/div>\n      <div class=\"tagline\">100% imaginary money. Zero real stakes.<\/div>\n    <\/div>\n    <div style=\"display:flex; align-items:center; gap:10px;\">\n      <div class=\"wallet\">\n        <div>\n          <div class=\"wallet-label\">BALANCE<\/div>\n          <div class=\"wallet-amount\" id=\"balanceDisplay\">$1,000<\/div>\n        <\/div>\n      <\/div>\n      <button class=\"reset-btn\" id=\"resetBtn\" type=\"button\">Reset balance<\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<div class=\"disclaimer\">\n  <p>Play-money simulator for fun only \u2014 no real currency, accounts, or payouts are involved anywhere in this page.<\/p>\n<\/div>\n\n<main>\n  <div class=\"cabinet-row\" id=\"gameTabs\">\n    <button class=\"cabinet-btn active\" data-game=\"coin\">COIN FLIP<\/button>\n    <button class=\"cabinet-btn\" data-game=\"dice\">DICE<\/button>\n    <button class=\"cabinet-btn\" data-game=\"slots\">SLOTS<\/button>\n    <button class=\"cabinet-btn\" data-game=\"crash\">CRASH<\/button>\n    <button class=\"cabinet-btn\" data-game=\"mines\">MINES<\/button>\n    <button class=\"cabinet-btn\" data-game=\"roulette\">ROULETTE<\/button>\n  <\/div>\n\n  <div class=\"stage\">\n\n    <!-- COIN FLIP -->\n    <section class=\"game-panel\" id=\"panel-coin\">\n      <h2 class=\"game-title\">Coin Flip<\/h2>\n      <p class=\"game-sub\">Pick a side, double your bet at 1.96\u00d7.<\/p>\n      <div class=\"controls\">\n        <div class=\"field\">\n          <label>BET AMOUNT<\/label>\n          <div class=\"bet-input-wrap\"><span>$<\/span><input type=\"number\" id=\"coinBet\" value=\"10\" min=\"1\"><\/div>\n        <\/div>\n        <div class=\"chip-row\">\n          <button class=\"chip\" data-target=\"coinBet\" data-amt=\"10\">$10<\/button>\n          <button class=\"chip\" data-target=\"coinBet\" data-amt=\"50\">$50<\/button>\n          <button class=\"chip\" data-target=\"coinBet\" data-amt=\"100\">$100<\/button>\n          <button class=\"chip\" data-target=\"coinBet\" data-amt=\"0\" data-max=\"1\">MAX<\/button>\n        <\/div>\n        <div class=\"field\">\n          <label>CALL IT<\/label>\n          <div class=\"side-pick\">\n            <button class=\"side-btn selected\" data-side=\"heads\">Heads<\/button>\n            <button class=\"side-btn\" data-side=\"tails\">Tails<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"coin-stage\">\n        <div class=\"coin\" id=\"coinEl\">?<\/div>\n        <button class=\"primary-btn\" id=\"coinPlayBtn\">FLIP<\/button>\n      <\/div>\n      <div class=\"result-line\" id=\"coinResult\"><\/div>\n    <\/section>\n\n    <!-- DICE -->\n    <section class=\"game-panel\" id=\"panel-dice\" style=\"display:none;\">\n      <h2 class=\"game-title\">Dice<\/h2>\n      <p class=\"game-sub\">Roll 0\u2013100. Choose over or under your target, riskier calls pay more.<\/p>\n      <div class=\"controls\">\n        <div class=\"field\">\n          <label>BET AMOUNT<\/label>\n          <div class=\"bet-input-wrap\"><span>$<\/span><input type=\"number\" id=\"diceBet\" value=\"10\" min=\"1\"><\/div>\n        <\/div>\n        <div class=\"chip-row\">\n          <button class=\"chip\" data-target=\"diceBet\" data-amt=\"10\">$10<\/button>\n          <button class=\"chip\" data-target=\"diceBet\" data-amt=\"50\">$50<\/button>\n          <button class=\"chip\" data-target=\"diceBet\" data-amt=\"100\">$100<\/button>\n          <button class=\"chip\" data-target=\"diceBet\" data-amt=\"0\" data-max=\"1\">MAX<\/button>\n        <\/div>\n        <div class=\"field\">\n          <label>TARGET<\/label>\n          <div class=\"bet-input-wrap\"><input type=\"number\" id=\"diceTarget\" value=\"50\" min=\"2\" max=\"98\" style=\"width:70px;\"><\/div>\n        <\/div>\n        <div class=\"field\">\n          <label>DIRECTION<\/label>\n          <div class=\"toggle-row\">\n            <button class=\"toggle-btn selected\" data-dir=\"under\">Roll Under<\/button>\n            <button class=\"toggle-btn\" data-dir=\"over\">Roll Over<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"dice-visual\">\n        <div class=\"dice-track\">\n          <div class=\"dice-marker\" id=\"diceMarker\"><\/div>\n          <div class=\"dice-roll-marker\" id=\"diceRollMarker\" style=\"left:0%;\"><\/div>\n        <\/div>\n        <div class=\"dice-readout\" id=\"diceReadout\">--<\/div>\n      <\/div>\n      <div class=\"stat-row\">\n        <div class=\"stat\">WIN CHANCE<b id=\"diceChance\">49%<\/b><\/div>\n        <div class=\"stat\">PAYOUT MULTIPLIER<b id=\"diceMult\">2.00\u00d7<\/b><\/div>\n      <\/div>\n      <div style=\"margin-top:20px;\">\n        <button class=\"primary-btn\" id=\"dicePlayBtn\">ROLL<\/button>\n      <\/div>\n      <div class=\"result-line\" id=\"diceResult\"><\/div>\n    <\/section>\n\n    <!-- SLOTS -->\n    <section class=\"game-panel\" id=\"panel-slots\" style=\"display:none;\">\n      <h2 class=\"game-title\">Slot Reels<\/h2>\n      <p class=\"game-sub\">Match three for the big win, two pays a small refund.<\/p>\n      <div class=\"controls\">\n        <div class=\"field\">\n          <label>BET AMOUNT<\/label>\n          <div class=\"bet-input-wrap\"><span>$<\/span><input type=\"number\" id=\"slotsBet\" value=\"10\" min=\"1\"><\/div>\n        <\/div>\n        <div class=\"chip-row\">\n          <button class=\"chip\" data-target=\"slotsBet\" data-amt=\"10\">$10<\/button>\n          <button class=\"chip\" data-target=\"slotsBet\" data-amt=\"50\">$50<\/button>\n          <button class=\"chip\" data-target=\"slotsBet\" data-amt=\"100\">$100<\/button>\n          <button class=\"chip\" data-target=\"slotsBet\" data-amt=\"0\" data-max=\"1\">MAX<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"reels\">\n        <div class=\"reel\" id=\"reel0\"><span>\ud83c\udf52<\/span><\/div>\n        <div class=\"reel\" id=\"reel1\"><span>\ud83c\udf4b<\/span><\/div>\n        <div class=\"reel\" id=\"reel2\"><span>\ud83d\udd14<\/span><\/div>\n      <\/div>\n      <div class=\"payline\">7\ufe0f\u20e37\ufe0f\u20e37\ufe0f\u20e3 = 25\u00d7 \u00b7 \ud83d\udc8e\ud83d\udc8e\ud83d\udc8e = 12\u00d7 \u00b7 \ud83d\udd14\ud83d\udd14\ud83d\udd14 = 8\u00d7 \u00b7 any pair = 1.5\u00d7<\/div>\n      <button class=\"primary-btn\" id=\"slotsPlayBtn\">SPIN<\/button>\n      <div class=\"result-line\" id=\"slotsResult\"><\/div>\n    <\/section>\n\n    <!-- CRASH -->\n    <section class=\"game-panel\" id=\"panel-crash\" style=\"display:none;\">\n      <h2 class=\"game-title\">Crash<\/h2>\n      <p class=\"game-sub\">Cash out before the rocket busts. Wait too long and it takes your bet with it.<\/p>\n      <div class=\"crash-wrap\">\n        <div class=\"crash-canvas-area\">\n          <div class=\"crash-multiplier\" id=\"crashMultDisplay\">1.00\u00d7<\/div>\n          <div class=\"crash-line\" id=\"crashLine\"><\/div>\n        <\/div>\n        <div class=\"crash-actions\">\n          <div class=\"field\">\n            <label>BET AMOUNT<\/label>\n            <div class=\"bet-input-wrap\"><span>$<\/span><input type=\"number\" id=\"crashBet\" value=\"10\" min=\"1\"><\/div>\n          <\/div>\n          <div class=\"chip-row\">\n            <button class=\"chip\" data-target=\"crashBet\" data-amt=\"10\">$10<\/button>\n            <button class=\"chip\" data-target=\"crashBet\" data-amt=\"50\">$50<\/button>\n            <button class=\"chip\" data-target=\"crashBet\" data-amt=\"100\">$100<\/button>\n            <button class=\"chip\" data-target=\"crashBet\" data-amt=\"0\" data-max=\"1\">MAX<\/button>\n          <\/div>\n          <button class=\"primary-btn\" id=\"crashStartBtn\">LAUNCH<\/button>\n          <button class=\"cashout-btn\" id=\"crashCashoutBtn\" disabled>CASH OUT<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"result-line\" id=\"crashResult\"><\/div>\n    <\/section>\n\n    <!-- MINES -->\n    <section class=\"game-panel\" id=\"panel-mines\" style=\"display:none;\">\n      <h2 class=\"game-title\">Mines<\/h2>\n      <p class=\"game-sub\">Reveal safe tiles to build your multiplier. Cash out before you hit a bomb.<\/p>\n      <div class=\"mines-wrap\">\n        <div class=\"mines-grid\" id=\"minesGrid\"><\/div>\n        <div class=\"mines-side\">\n          <div class=\"field\">\n            <label>BET AMOUNT<\/label>\n            <div class=\"bet-input-wrap\"><span>$<\/span><input type=\"number\" id=\"minesBet\" value=\"10\" min=\"1\"><\/div>\n          <\/div>\n          <div class=\"chip-row\">\n            <button class=\"chip\" data-target=\"minesBet\" data-amt=\"10\">$10<\/button>\n            <button class=\"chip\" data-target=\"minesBet\" data-amt=\"50\">$50<\/button>\n            <button class=\"chip\" data-target=\"minesBet\" data-amt=\"100\">$100<\/button>\n            <button class=\"chip\" data-target=\"minesBet\" data-amt=\"0\" data-max=\"1\">MAX<\/button>\n          <\/div>\n          <div class=\"mines-field\">\n            <label>BOMBS<\/label>\n            <select id=\"minesCount\">\n              <option value=\"1\">1<\/option>\n              <option value=\"3\" selected>3<\/option>\n              <option value=\"5\">5<\/option>\n              <option value=\"8\">8<\/option>\n              <option value=\"12\">12<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"mines-stat\">CURRENT MULTIPLIER<b id=\"minesMult\">1.00\u00d7<\/b><\/div>\n          <button class=\"primary-btn\" id=\"minesStartBtn\">START GAME<\/button>\n          <button class=\"cashout-btn\" id=\"minesCashoutBtn\" disabled>CASH OUT<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"result-line\" id=\"minesResult\"><\/div>\n    <\/section>\n\n    <!-- ROULETTE -->\n    <section class=\"game-panel\" id=\"panel-roulette\" style=\"display:none;\">\n      <h2 class=\"game-title\">Roulette<\/h2>\n      <p class=\"game-sub\">Bet on a color. Red or black pay 2\u00d7, green pays 14\u00d7.<\/p>\n      <div class=\"roulette-wrap\">\n        <div style=\"position:relative;\">\n          <div class=\"wheel-pin\"><\/div>\n          <div class=\"wheel-frame\">\n            <div class=\"wheel-disc\" id=\"wheelDisc\"><div class=\"wheel-center\" id=\"wheelResultText\">?<\/div><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"roulette-side\">\n          <div class=\"field\">\n            <label>BET AMOUNT<\/label>\n            <div class=\"bet-input-wrap\"><span>$<\/span><input type=\"number\" id=\"rouletteBet\" value=\"10\" min=\"1\"><\/div>\n          <\/div>\n          <div class=\"chip-row\">\n            <button class=\"chip\" data-target=\"rouletteBet\" data-amt=\"10\">$10<\/button>\n            <button class=\"chip\" data-target=\"rouletteBet\" data-amt=\"50\">$50<\/button>\n            <button class=\"chip\" data-target=\"rouletteBet\" data-amt=\"100\">$100<\/button>\n            <button class=\"chip\" data-target=\"rouletteBet\" data-amt=\"0\" data-max=\"1\">MAX<\/button>\n          <\/div>\n          <div class=\"field\">\n            <label>PLACE YOUR BET<\/label>\n            <div class=\"bet-grid\">\n              <button class=\"rbet-btn selected\" data-color=\"red\">RED (2\u00d7)<\/button>\n              <button class=\"rbet-btn\" data-color=\"black\">BLACK (2\u00d7)<\/button>\n              <button class=\"rbet-btn\" data-color=\"green\">GREEN (14\u00d7)<\/button>\n            <\/div>\n          <\/div>\n          <button class=\"primary-btn\" id=\"rouletteSpinBtn\">SPIN<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"result-line\" id=\"rouletteResult\"><\/div>\n    <\/section>\n\n  <\/div>\n<\/main>\n\n<footer>FakeStake is a self-contained entertainment demo. No real money, wagering, or accounts exist here.<\/footer>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var STORAGE_KEY = \"fakestake_balance_v1\";\n  var balance = 1000;\n\n  function loadBalance(){\n    try{\n      var raw = localStorage.getItem(STORAGE_KEY);\n      if(raw !== null){\n        var n = parseFloat(raw);\n        if(!isNaN(n)) balance = n;\n      }\n    }catch(e){ /* storage unavailable, fall back to in-memory default */ }\n  }\n  function saveBalance(){\n    try{ localStorage.setItem(STORAGE_KEY, String(balance)); }catch(e){}\n  }\n  function fmt(n){\n    var neg = n < 0;\n    n = Math.abs(n);\n    var s = n.toFixed(2).replace(/\\.00$/, \"\");\n    var parts = s.split(\".\");\n    parts[0] = parts[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g, \",\");\n    return (neg ? \"-$\" : \"$\") + parts.join(\".\");\n  }\n  function renderBalance(){\n    document.getElementById(\"balanceDisplay\").textContent = fmt(balance);\n  }\n  function changeBalance(delta){\n    balance = Math.round((balance + delta) * 100) / 100;\n    if(balance < 0) balance = 0;\n    saveBalance();\n    renderBalance();\n  }\n\n  loadBalance();\n  renderBalance();\n\n  document.getElementById(\"resetBtn\").addEventListener(\"click\", function(){\n    balance = 1000;\n    saveBalance();\n    renderBalance();\n  });\n\n  // ---------- bet helpers ----------\n  function getBetInput(id){ return document.getElementById(id); }\n  function readBet(id){\n    var el = getBetInput(id);\n    var v = parseFloat(el.value);\n    if(isNaN(v) || v <= 0) v = 0;\n    return Math.min(v, balance);\n  }\n  function wireChips(){\n    document.querySelectorAll(\".chip\").forEach(function(chip){\n      chip.addEventListener(\"click\", function(){\n        var target = chip.getAttribute(\"data-target\");\n        var el = getBetInput(target);\n        if(chip.hasAttribute(\"data-max\")){\n          el.value = balance > 0 ? balance : 0;\n        }else{\n          el.value = chip.getAttribute(\"data-amt\");\n        }\n      });\n    });\n  }\n  wireChips();\n\n  // ---------- tabs ----------\n  var panels = [\"coin\",\"dice\",\"slots\",\"crash\",\"mines\",\"roulette\"];\n  document.getElementById(\"gameTabs\").addEventListener(\"click\", function(e){\n    var btn = e.target.closest(\".cabinet-btn\");\n    if(!btn) return;\n    var game = btn.getAttribute(\"data-game\");\n    panels.forEach(function(p){\n      document.getElementById(\"panel-\" + p).style.display = (p === game) ? \"\" : \"none\";\n    });\n    document.querySelectorAll(\".cabinet-btn\").forEach(function(b){ b.classList.remove(\"active\"); });\n    btn.classList.add(\"active\");\n  });\n\n  // ================= COIN FLIP =================\n  (function(){\n    var side = \"heads\";\n    document.querySelectorAll(\".side-btn\").forEach(function(btn){\n      btn.addEventListener(\"click\", function(){\n        document.querySelectorAll(\".side-btn\").forEach(function(b){ b.classList.remove(\"selected\"); });\n        btn.classList.add(\"selected\");\n        side = btn.getAttribute(\"data-side\");\n      });\n    });\n    var coinEl = document.getElementById(\"coinEl\");\n    var resultEl = document.getElementById(\"coinResult\");\n    var playBtn = document.getElementById(\"coinPlayBtn\");\n\n    playBtn.addEventListener(\"click\", function(){\n      var bet = readBet(\"coinBet\");\n      if(bet <= 0){ resultEl.textContent = \"Enter a valid bet.\"; resultEl.className = \"result-line lose\"; return; }\n      playBtn.disabled = true;\n      changeBalance(-bet);\n      resultEl.textContent = \"\";\n      coinEl.classList.add(\"flipping\");\n      coinEl.textContent = \"\";\n      setTimeout(function(){\n        coinEl.classList.remove(\"flipping\");\n        var outcome = Math.random() < 0.5 ? \"heads\" : \"tails\";\n        coinEl.textContent = outcome === \"heads\" ? \"H\" : \"T\";\n        if(outcome === side){\n          var win = Math.round(bet * 1.96 * 100) / 100;\n          changeBalance(win);\n          resultEl.textContent = \"It's \" + outcome + \" \u2014 you won \" + fmt(win) + \"!\";\n          resultEl.className = \"result-line win\";\n        }else{\n          resultEl.textContent = \"It's \" + outcome + \" \u2014 you lost \" + fmt(bet) + \".\";\n          resultEl.className = \"result-line lose\";\n        }\n        playBtn.disabled = false;\n      }, 900);\n    });\n  })();\n\n  // ================= DICE =================\n  (function(){\n    var dir = \"under\";\n    document.querySelectorAll(\"#panel-dice .toggle-btn\").forEach(function(btn){\n      btn.addEventListener(\"click\", function(){\n        document.querySelectorAll(\"#panel-dice .toggle-btn\").forEach(function(b){ b.classList.remove(\"selected\"); });\n        btn.classList.add(\"selected\");\n        dir = btn.getAttribute(\"data-dir\");\n        updateDiceStats();\n      });\n    });\n    var targetInput = document.getElementById(\"diceTarget\");\n    var marker = document.getElementById(\"diceMarker\");\n    var rollMarker = document.getElementById(\"diceRollMarker\");\n    var readout = document.getElementById(\"diceReadout\");\n    var chanceEl = document.getElementById(\"diceChance\");\n    var multEl = document.getElementById(\"diceMult\");\n    var resultEl = document.getElementById(\"diceResult\");\n    var HOUSE_EDGE = 0.02;\n\n    function clampTarget(){\n      var t = parseFloat(targetInput.value);\n      if(isNaN(t)) t = 50;\n      t = Math.max(2, Math.min(98, t));\n      targetInput.value = t;\n      return t;\n    }\n    function updateDiceStats(){\n      var t = clampTarget();\n      marker.style.left = t + \"%\";\n      var chance = dir === \"under\" ? t : (100 - t);\n      chance = Math.max(1, Math.min(97, chance));\n      var mult = (100 / chance) * (1 - HOUSE_EDGE);\n      chanceEl.textContent = chance.toFixed(0) + \"%\";\n      multEl.textContent = mult.toFixed(2) + \"\u00d7\";\n    }\n    targetInput.addEventListener(\"input\", updateDiceStats);\n    updateDiceStats();\n\n    document.getElementById(\"dicePlayBtn\").addEventListener(\"click\", function(){\n      var bet = readBet(\"diceBet\");\n      if(bet <= 0){ resultEl.textContent = \"Enter a valid bet.\"; resultEl.className = \"result-line lose\"; return; }\n      var t = clampTarget();\n      var chance = dir === \"under\" ? t : (100 - t);\n      chance = Math.max(1, Math.min(97, chance));\n      var mult = (100 / chance) * (1 - HOUSE_EDGE);\n      changeBalance(-bet);\n      var roll = Math.random() * 100;\n      rollMarker.style.left = roll + \"%\";\n      readout.textContent = roll.toFixed(1);\n      var win = dir === \"under\" ? roll < t : roll > t;\n      if(win){\n        var amt = Math.round(bet * mult * 100) / 100;\n        changeBalance(amt);\n        resultEl.textContent = \"Rolled \" + roll.toFixed(1) + \" \u2014 you won \" + fmt(amt) + \"!\";\n        resultEl.className = \"result-line win\";\n      }else{\n        resultEl.textContent = \"Rolled \" + roll.toFixed(1) + \" \u2014 you lost \" + fmt(bet) + \".\";\n        resultEl.className = \"result-line lose\";\n      }\n    });\n  })();\n\n  // ================= SLOTS =================\n  (function(){\n    var symbols = [\"\ud83c\udf52\",\"\ud83c\udf4b\",\"\ud83d\udd14\",\"\u2b50\",\"\ud83d\udc8e\",\"7\ufe0f\u20e3\"];\n    var weights  = [30, 25, 20, 14, 8, 3]; // rarer = higher payout\n    var reels = [document.getElementById(\"reel0\"), document.getElementById(\"reel1\"), document.getElementById(\"reel2\")];\n    var resultEl = document.getElementById(\"slotsResult\");\n    var playBtn = document.getElementById(\"slotsPlayBtn\");\n\n    function weightedPick(){\n      var total = weights.reduce(function(a,b){return a+b;}, 0);\n      var r = Math.random() * total;\n      for(var i=0;i<symbols.length;i++){\n        if(r < weights[i]) return symbols[i];\n        r -= weights[i];\n      }\n      return symbols[0];\n    }\n    function payoutFor(a,b,c){\n      if(a === b && b === c){\n        if(a === \"7\ufe0f\u20e3\") return 25;\n        if(a === \"\ud83d\udc8e\") return 12;\n        if(a === \"\u2b50\") return 10;\n        if(a === \"\ud83d\udd14\") return 8;\n        if(a === \"\ud83c\udf4b\") return 5;\n        return 3; // cherries\n      }\n      if(a === b || b === c || a === c) return 1.5;\n      return 0;\n    }\n\n    playBtn.addEventListener(\"click\", function(){\n      var bet = readBet(\"slotsBet\");\n      if(bet <= 0){ resultEl.textContent = \"Enter a valid bet.\"; resultEl.className = \"result-line lose\"; return; }\n      playBtn.disabled = true;\n      changeBalance(-bet);\n      resultEl.textContent = \"\";\n      reels.forEach(function(r){ r.classList.add(\"spinning\"); });\n\n      var spins = 0;\n      var interval = setInterval(function(){\n        reels.forEach(function(r){ r.querySelector(\"span\").textContent = weightedPick(); });\n        spins++;\n        if(spins > 12){\n          clearInterval(interval);\n          reels.forEach(function(r){ r.classList.remove(\"spinning\"); });\n          var final = [weightedPick(), weightedPick(), weightedPick()];\n          reels.forEach(function(r, i){ r.querySelector(\"span\").textContent = final[i]; });\n          var mult = payoutFor(final[0], final[1], final[2]);\n          if(mult > 0){\n            var win = Math.round(bet * mult * 100) / 100;\n            changeBalance(win);\n            resultEl.textContent = final.join(\" \") + \" \u2014 you won \" + fmt(win) + \" (\" + mult + \"\u00d7)!\";\n            resultEl.className = \"result-line win\";\n          }else{\n            resultEl.textContent = final.join(\" \") + \" \u2014 no match, you lost \" + fmt(bet) + \".\";\n            resultEl.className = \"result-line lose\";\n          }\n          playBtn.disabled = false;\n        }\n      }, 70);\n    });\n  })();\n\n  // ================= CRASH =================\n  (function(){\n    var multDisplay = document.getElementById(\"crashMultDisplay\");\n    var line = document.getElementById(\"crashLine\");\n    var startBtn = document.getElementById(\"crashStartBtn\");\n    var cashoutBtn = document.getElementById(\"crashCashoutBtn\");\n    var resultEl = document.getElementById(\"crashResult\");\n    var area = document.querySelector(\".crash-canvas-area\");\n\n    var running = false;\n    var mult = 1.0;\n    var crashPoint = 1.0;\n    var bet = 0;\n    var cashed = false;\n    var rafId = null;\n    var startTime = 0;\n\n    function rollCrashPoint(){\n      // heavier weight toward low multipliers, occasional big runs, ~4% house edge feel\n      var r = Math.random();\n      var point = 0.98 / (1 - r);\n      return Math.max(1.01, Math.min(point, 50));\n    }\n\n    function reset(){\n      running = false;\n      mult = 1.0;\n      cashed = false;\n      multDisplay.textContent = \"1.00\u00d7\";\n      multDisplay.classList.remove(\"busted\");\n      line.style.height = \"0%\";\n      line.style.width = \"4px\";\n      cashoutBtn.disabled = true;\n      startBtn.disabled = false;\n    }\n    reset();\n\n    startBtn.addEventListener(\"click\", function(){\n      bet = readBet(\"crashBet\");\n      if(bet <= 0){ resultEl.textContent = \"Enter a valid bet.\"; resultEl.className = \"result-line lose\"; return; }\n      changeBalance(-bet);\n      resultEl.textContent = \"\";\n      crashPoint = rollCrashPoint();\n      running = true;\n      cashed = false;\n      startBtn.disabled = true;\n      cashoutBtn.disabled = false;\n      multDisplay.classList.remove(\"busted\");\n      startTime = performance.now();\n      tick();\n    });\n\n    function tick(){\n      if(!running) return;\n      var elapsed = (performance.now() - startTime) / 1000;\n      mult = 1 + elapsed * elapsed * 0.18; // accelerating curve\n      if(mult >= crashPoint){\n        mult = crashPoint;\n        multDisplay.textContent = mult.toFixed(2) + \"\u00d7\";\n        var h = Math.min(90, (mult - 1) * 18);\n        line.style.height = h + \"%\";\n        busted();\n        return;\n      }\n      multDisplay.textContent = mult.toFixed(2) + \"\u00d7\";\n      var height = Math.min(90, (mult - 1) * 18);\n      line.style.height = height + \"%\";\n      rafId = requestAnimationFrame(tick);\n    }\n\n    function busted(){\n      running = false;\n      cashoutBtn.disabled = true;\n      startBtn.disabled = false;\n      if(!cashed){\n        multDisplay.classList.add(\"busted\");\n        resultEl.textContent = \"Busted at \" + crashPoint.toFixed(2) + \"\u00d7 \u2014 you lost \" + fmt(bet) + \".\";\n        resultEl.className = \"result-line lose\";\n      }\n    }\n\n    cashoutBtn.addEventListener(\"click\", function(){\n      if(!running || cashed) return;\n      cashed = true;\n      running = false;\n      if(rafId) cancelAnimationFrame(rafId);\n      var win = Math.round(bet * mult * 100) / 100;\n      changeBalance(win);\n      resultEl.textContent = \"Cashed out at \" + mult.toFixed(2) + \"\u00d7 \u2014 you won \" + fmt(win) + \"!\";\n      resultEl.className = \"result-line win\";\n      cashoutBtn.disabled = true;\n      startBtn.disabled = false;\n    });\n  })();\n\n  // ================= MINES =================\n  (function(){\n    var GRID_SIZE = 25;\n    var grid = document.getElementById(\"minesGrid\");\n    var startBtn = document.getElementById(\"minesStartBtn\");\n    var cashoutBtn = document.getElementById(\"minesCashoutBtn\");\n    var multEl = document.getElementById(\"minesMult\");\n    var resultEl = document.getElementById(\"minesResult\");\n    var bombCountSelect = document.getElementById(\"minesCount\");\n\n    var tiles = [];\n    var bombSet = null;\n    var revealedCount = 0;\n    var bombCount = 3;\n    var bet = 0;\n    var active = false;\n\n    function buildGrid(){\n      grid.innerHTML = \"\";\n      tiles = [];\n      for(var i=0;i<GRID_SIZE;i++){\n        var t = document.createElement(\"div\");\n        t.className = \"mine-tile\";\n        t.setAttribute(\"data-idx\", i);\n        t.textContent = \"\";\n        grid.appendChild(t);\n        tiles.push(t);\n      }\n    }\n    buildGrid();\n\n    function currentMultiplier(){\n      // fair-ish escalating multiplier with a house edge factor\n      var safeTiles = GRID_SIZE - bombCount;\n      var mult = 1;\n      for(var k=0;k<revealedCount;k++){\n        mult *= (GRID_SIZE - k) / (safeTiles - k);\n      }\n      return mult * 0.96;\n    }\n\n    function endGame(won){\n      active = false;\n      startBtn.disabled = false;\n      cashoutBtn.disabled = true;\n      tiles.forEach(function(t){ t.classList.add(\"disabled\"); });\n      if(!won){\n        tiles.forEach(function(t){\n          var idx = parseInt(t.getAttribute(\"data-idx\"), 10);\n          if(bombSet.has(idx) && !t.classList.contains(\"revealed\")){\n            t.classList.add(\"revealed\", \"bomb\");\n            t.textContent = \"\ud83d\udca3\";\n          }\n        });\n      }\n    }\n\n    startBtn.addEventListener(\"click\", function(){\n      bet = readBet(\"minesBet\");\n      if(bet <= 0){ resultEl.textContent = \"Enter a valid bet.\"; resultEl.className = \"result-line lose\"; return; }\n      bombCount = parseInt(bombCountSelect.value, 10);\n      changeBalance(-bet);\n      buildGrid();\n      revealedCount = 0;\n      active = true;\n      multEl.textContent = \"1.00\u00d7\";\n      resultEl.textContent = \"\";\n      resultEl.className = \"result-line\";\n      startBtn.disabled = true;\n      cashoutBtn.disabled = false;\n\n      bombSet = new Set();\n      while(bombSet.size < bombCount){\n        bombSet.add(Math.floor(Math.random() * GRID_SIZE));\n      }\n\n      tiles.forEach(function(t){\n        t.addEventListener(\"click\", onTileClick);\n      });\n    });\n\n    function onTileClick(e){\n      if(!active) return;\n      var t = e.currentTarget;\n      if(t.classList.contains(\"revealed\")) return;\n      var idx = parseInt(t.getAttribute(\"data-idx\"), 10);\n      if(bombSet.has(idx)){\n        t.classList.add(\"revealed\", \"bomb\");\n        t.textContent = \"\ud83d\udca3\";\n        resultEl.textContent = \"Boom \u2014 you lost \" + fmt(bet) + \".\";\n        resultEl.className = \"result-line lose\";\n        endGame(false);\n      }else{\n        t.classList.add(\"revealed\", \"safe\");\n        t.textContent = \"\ud83d\udc8e\";\n        revealedCount++;\n        var mult = currentMultiplier();\n        multEl.textContent = mult.toFixed(2) + \"\u00d7\";\n        if(revealedCount === GRID_SIZE - bombCount){\n          var win = Math.round(bet * mult * 100) / 100;\n          changeBalance(win);\n          resultEl.textContent = \"All safe tiles cleared \u2014 you won \" + fmt(win) + \"!\";\n          resultEl.className = \"result-line win\";\n          endGame(true);\n        }\n      }\n    }\n\n    cashoutBtn.addEventListener(\"click\", function(){\n      if(!active || revealedCount === 0) return;\n      var mult = currentMultiplier();\n      var win = Math.round(bet * mult * 100) / 100;\n      changeBalance(win);\n      resultEl.textContent = \"Cashed out at \" + mult.toFixed(2) + \"\u00d7 \u2014 you won \" + fmt(win) + \"!\";\n      resultEl.className = \"result-line win\";\n      endGame(true);\n    });\n  })();\n\n  // ================= ROULETTE =================\n  (function(){\n    var disc = document.getElementById(\"wheelDisc\");\n    var resultText = document.getElementById(\"wheelResultText\");\n    var spinBtn = document.getElementById(\"rouletteSpinBtn\");\n    var resultEl = document.getElementById(\"rouletteResult\");\n    var chosenColor = \"red\";\n    var currentRotation = 0;\n\n    document.querySelectorAll(\".rbet-btn\").forEach(function(btn){\n      btn.addEventListener(\"click\", function(){\n        document.querySelectorAll(\".rbet-btn\").forEach(function(b){ b.classList.remove(\"selected\"); });\n        btn.classList.add(\"selected\");\n        chosenColor = btn.getAttribute(\"data-color\");\n      });\n    });\n\n    // wheel layout mirrors the conic-gradient: 0-349deg alternating red/black in 24deg\n    // segments (7 red + 7 black), 349-360deg is green.\n    function pickOutcome(){\n      var r = Math.random() * 100;\n      if(r < 4.0) return \"green\";              // ~4%\n      return (r < 52) ? \"red\" : \"black\";        // ~48% / ~48%\n    }\n    function angleForOutcome(outcome){\n      if(outcome === \"green\") return 349 + Math.random() * 11;\n      var redBands = [0,48,96,144,192,240,288];\n      var blackBands = [24,72,120,168,216,264,312];\n      var bands = outcome === \"red\" ? redBands : blackBands;\n      var band = bands[Math.floor(Math.random() * bands.length)];\n      return band + Math.random() * 24;\n    }\n\n    spinBtn.addEventListener(\"click\", function(){\n      var bet = readBet(\"rouletteBet\");\n      if(bet <= 0){ resultEl.textContent = \"Enter a valid bet.\"; resultEl.className = \"result-line lose\"; return; }\n      changeBalance(-bet);\n      spinBtn.disabled = true;\n      resultEl.textContent = \"\";\n      resultText.textContent = \"\";\n\n      var outcome = pickOutcome();\n      var targetAngle = angleForOutcome(outcome);\n      // spin several full turns then land so that targetAngle sits under the top pin\n      var extraTurns = 5 * 360;\n      var finalRotation = currentRotation - (currentRotation % 360) + extraTurns + (360 - targetAngle);\n      currentRotation = finalRotation;\n      disc.style.transform = \"rotate(\" + finalRotation + \"deg)\";\n\n      setTimeout(function(){\n        var label = outcome === \"green\" ? \"GREEN\" : (outcome === \"red\" ? \"RED\" : \"BLACK\");\n        resultText.textContent = label[0];\n        var win = 0;\n        if(outcome === chosenColor){\n          var mult = outcome === \"green\" ? 14 : 2;\n          win = Math.round(bet * mult * 100) / 100;\n          changeBalance(win);\n          resultEl.textContent = label + \" \u2014 you won \" + fmt(win) + \" (\" + mult + \"\u00d7)!\";\n          resultEl.className = \"result-line win\";\n        }else{\n          resultEl.textContent = label + \" \u2014 you lost \" + fmt(bet) + \".\";\n          resultEl.className = \"result-line lose\";\n        }\n        spinBtn.disabled = false;\n      }, 3300);\n    });\n  })();\n\n})();\n<\/script>\n<\/body>\n<\/html>\n";

  function genUid(){ return 'uid_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10); }
  function genFriendCode(){
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  function getMyAccount(){

  function ensureAccountIdentity(){
    var accounts = loadAccounts();
    var idx = -1, me = null;
    for(var i=0;i<accounts.length;i++){ if(accounts[i].id===activeAccountId()){ me=accounts[i]; idx=i; break; } }
    if(!me) return;
    var changed = false;
    if(!me.uid){ me.uid = genUid(); changed = true; }
    if(!me.friendCode){ me.friendCode = genFriendCode(); changed = true; }
    if(changed){ accounts[idx] = me; saveAccounts(accounts); }
    if(fbReady){
      fbDb.ref('directory/'+me.friendCode).set({name:me.name, avatar:me.avatar, uid:me.uid, updatedAt:Date.now()}).catch(function(){});
    }

  var msgThreadDrawFn = null;
  var realListenersAttached = {};
  function convIdFor(otherUid){
    var mine = getMyUid();
    if(!mine || !otherUid) return null;
    return [mine, otherUid].sort().join('__');
  }
  function attachRealListener(contact){
    if(!fbReady) return;
    if(!contact.realUid && !contact.isGroup) return;
    var key = contactKey(contact);
    if(realListenersAttached[key]) return;
    var myUid = getMyUid();
    var msgPath;
    if(contact.isGroup){
      msgPath = 'groups/'+contact.groupId+'/messages';
    } else {
      var convId = convIdFor(contact.realUid);
      if(!convId) return;
      msgPath = 'chats/'+convId+'/messages';
    }
    realListenersAttached[key] = true;
    fbDb.ref(msgPath).on('child_added', function(snap){
      var msg = snap.val();
      if(!msg) return;
      if(!state.messages[key]) state.messages[key] = [];
      var already = state.messages[key].some(function(m){ return m.fbKey === snap.key; });
      if(already) return;
      var isMe = msg.from===myUid;
      var entry = {from: isMe ? 'me' : 'them', text: msg.text, time: msg.time || Date.now(), fbKey: snap.key, senderName: msg.fromName || ''};
      if(msg.type==='app_share'){
        entry.type = 'app_share';
        entry.shareId = msg.shareId;
        entry.appName = msg.appName;
        entry.appIcon = msg.appIcon;
      }
      state.messages[key].push(entry);
      state.messages[key].sort(function(a,b){ return a.time - b.time; });
      saveState();

      var threadOpen = (currentMessageThread===key && state.currentApp==='messages' && msgThreadDrawFn);
      if(threadOpen){
        msgThreadDrawFn();
        if(!isMe) sfx('notify');
      } else if(!isMe){
        if(state.currentApp==='messages' && !currentMessageThread){
          renderMessages();
          sfx('notify');
        } else {
          var notifyText = contact.isGroup ? ((entry.senderName||'Someone')+' in '+contact.name+': '+entry.text) : (contact.name+': '+entry.text);
          pushNotification('messages', contact.avatar || '\u{1F4AC}', notifyText);
        }
      }
    });
  }
  function attachAllRealListeners(){
    state.contacts.forEach(function(c){ if(c.realUid || c.isGroup) attachRealListener(c); });
  }
  function sendRealMessage(contact, text, extra){
    if(!fbReady){ toast('Real chat is not connected right now'); return Promise.reject(new Error('not connected')); }
    var me = getMyAccount();
    var payload = {from:getMyUid(), fromName:(me?me.name:'Someone'), text:text, time:Date.now()};
    if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k)) payload[k] = extra[k]; } }
    if(contact.isGroup){
      return fbDb.ref('groups/'+contact.groupId+'/messages').push(payload).catch(function(err){
        toast('Could not send (' + (err && (err.code||err.message) || 'check your connection') + ')');
        throw err;
      });
    }
    var convId = convIdFor(contact.realUid);
    if(!convId) return Promise.reject(new Error('no conversation'));
    return fbDb.ref('chats/'+convId+'/messages').push(payload).catch(function(err){
      toast('Could not send (' + (err && (err.code||err.message) || 'check your connection') + ')');
      throw err;
    });
  }
  function addRealContactByCode(){

      if(!data){ toast('No account found with that code'); return; }

      var already = state.contacts.some(function(c){ return c.realUid===data.uid; });
      if(already){ toast('Already in your contacts'); return; }
      var newContact = {name:data.name, number:'Friend code '+code, realUid:data.uid, avatar:data.avatar};
      state.contacts.push(newContact);
      saveState();
      toast('Added ' + data.name + '!');

  function createGroup(name, memberUids){
    if(!fbReady){ toast('Real chat is not connected right now'); return; }
    var myUid = getMyUid();
    var allMembers = [myUid].concat(memberUids.filter(function(u){ return u!==myUid; }));
    var groupId = 'grp_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);

    allMembers.forEach(function(uid){ membersObj[uid] = true; });
    var me = getMyAccount();
    var groupData = {name:name, avatar:'\u{1F465}', createdBy:myUid, createdByName:(me?me.name:'Someone'), createdAt:Date.now(), members:membersObj};
    fbDb.ref('groups/'+groupId).set(groupData).then(function(){
      var updates = {};
      allMembers.forEach(function(uid){ updates['userGroups/'+uid+'/'+groupId] = true; });
      return fbDb.ref().update(updates);
    }).then(function(){
      var localGroup = {name:name, number:'Group chat', isGroup:true, groupId:groupId, avatar:'\u{1F465}', memberUids:allMembers};
      state.contacts.push(localGroup);
      saveState();
      attachRealListener(localGroup);
      toast('Group created!');
      renderMessages();
    }).catch(function(err){ toast('Could not create the group (' + (err && (err.code||err.message) || 'check your connection') + ')'); });
  }
  function attachGroupMembershipListener(){

    var myUid = getMyUid();

    fbDb.ref('userGroups/'+myUid).on('child_added', function(snap){
      var groupId = snap.key;
      var existing = state.contacts.filter(function(c){ return c.groupId===groupId; })[0];
      if(existing){ attachRealListener(existing); return; }
      fbDb.ref('groups/'+groupId).once('value').then(function(gsnap){

        if(!g) return;
        var localGroup = {name:g.name, number:'Group chat', isGroup:true, groupId:groupId, avatar:g.avatar||'\u{1F465}', memberUids:Object.keys(g.members||{})};
        state.contacts.push(localGroup);

  /* ===================== SOUND EFFECTS ===================== */
  var sfxCtxRef = null;
  function sfxCtx(){
    if(!sfxCtxRef) sfxCtxRef = new (window.AudioContext || window.webkitAudioContext)();
    if(sfxCtxRef.state==='suspended') sfxCtxRef.resume();
    return sfxCtxRef;
  }
  function tone(freq, start, dur, type, vol, ctx, dest){
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type||'square';
    osc.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.linearRampToValueAtTime(vol||0.1, start+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    osc.connect(g).connect(dest);
    osc.start(start); osc.stop(start+dur+0.02);
  }
  function noiseBurst(start, dur, vol, ctx, dest){
    var bufferSize = Math.floor(ctx.sampleRate*dur);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    var src = ctx.createBufferSource(); src.buffer = buffer;
    var g = ctx.createGain(); g.gain.value = vol||0.15;
    src.connect(g).connect(dest);
    src.start(start);
  }
  function sfx(type){
    if(!state.soundOn) return;
    try{
      var ctx = sfxCtx();
      var dest = ctx.destination;
      var t = ctx.currentTime;
      switch(type){
        case 'click': tone(720, t, 0.05, 'square', 0.06, ctx, dest); break;
        case 'open': tone(440, t, 0.06, 'square', 0.07, ctx, dest); tone(660, t+0.05, 0.08, 'square', 0.07, ctx, dest); break;
        case 'close': tone(520, t, 0.06, 'square', 0.06, ctx, dest); tone(340, t+0.05, 0.08, 'square', 0.06, ctx, dest); break;
        case 'toggle': tone(600, t, 0.04, 'square', 0.06, ctx, dest); break;
        case 'key': tone(880, t, 0.035, 'square', 0.05, ctx, dest); break;
        case 'notify': tone(1000, t, 0.05, 'sine', 0.06, ctx, dest); tone(1300, t+0.06, 0.07, 'sine', 0.06, ctx, dest); break;
        case 'unlock': tone(500, t, 0.05, 'triangle', 0.07, ctx, dest); tone(750, t+0.05, 0.05, 'triangle', 0.07, ctx, dest); tone(1000, t+0.1, 0.08, 'triangle', 0.07, ctx, dest); break;
        case 'boot': tone(330, t, 0.1, 'triangle', 0.08, ctx, dest); tone(440, t+0.11, 0.1, 'triangle', 0.08, ctx, dest); tone(660, t+0.22, 0.18, 'triangle', 0.08, ctx, dest); break;
        case 'shutter': noiseBurst(t, 0.05, 0.22, ctx, dest); tone(180, t+0.04, 0.05, 'square', 0.1, ctx, dest); break;
        case 'win': tone(523, t, 0.09, 'square', 0.07, ctx, dest); tone(659, t+0.09, 0.09, 'square', 0.07, ctx, dest); tone(784, t+0.18, 0.16, 'square', 0.07, ctx, dest); break;
        case 'lose': tone(300, t, 0.12, 'sawtooth', 0.06, ctx, dest); tone(220, t+0.12, 0.16, 'sawtooth', 0.06, ctx, dest); break;
        case 'eat': tone(880, t, 0.05, 'square', 0.06, ctx, dest); break;
        case 'merge': tone(660, t, 0.04, 'triangle', 0.06, ctx, dest); tone(990, t+0.04, 0.06, 'triangle', 0.06, ctx, dest); break;
        case 'bounce': tone(400, t, 0.03, 'square', 0.05, ctx, dest); break;
        case 'score': tone(760, t, 0.05, 'triangle', 0.07, ctx, dest); tone(1020, t+0.05, 0.08, 'triangle', 0.07, ctx, dest); break;
        case 'success': tone(600, t, 0.05, 'sine', 0.07, ctx, dest); tone(900, t+0.05, 0.05, 'sine', 0.07, ctx, dest); tone(1200, t+0.1, 0.1, 'sine', 0.07, ctx, dest); break;
        case 'ring': tone(480, t, 0.35, 'sine', 0.09, ctx, dest); tone(620, t+0.4, 0.35, 'sine', 0.09, ctx, dest); break;
        case 'dial': tone(950, t, 0.08, 'square', 0.05, ctx, dest); break;
        case 'beep': tone(1100, t, 0.15, 'square', 0.08, ctx, dest); break;
        default: tone(600, t, 0.04, 'square', 0.05, ctx, dest);
      }
    }catch(e){}
  }
  function fmtTime(d){
    var h = d.getHours(), m = d.getMinutes();
    if(state.clock24h){
      return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
    }
    var ap = h>=12?'PM':'AM';
    var h12 = h%12; if(h12===0) h12=12;
    return h12+':'+(m<10?'0':'')+m+' '+ap;
  }
  function fmtDate(d){
    var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate();
  }

  }

  function orderedAppDefs(){
    var defs = allAppDefs();
    var byId = {};
    defs.forEach(function(d){ byId[d.id] = d; });
    var order = state.iconOrder.filter(function(id){ return byId[id]; });
    var seen = {};
    order.forEach(function(id){ seen[id] = true; });
    defs.forEach(function(d){ if(!seen[d.id]){ order.push(d.id); seen[d.id] = true; } });
    state.iconOrder = order;
    return order.map(function(id){ return byId[id]; });
  }
  function computePages(){
    var defs = orderedAppDefs();
    var pages = [];
    for(var i=0; i<defs.length; i+=ICONS_PER_PAGE){ pages.push(defs.slice(i, i+ICONS_PER_PAGE)); }
    if(!pages.length) pages.push([]);
    return pages;
  }

  function makeIcon(def, container, pageIdx, idxInPage){
    var wrap = el('div','app-icon');
    wrap.dataset.id = def.id;
    if(pageIdx!=null){ wrap.dataset.page = pageIdx; wrap.dataset.idx = idxInPage; }
    var isBuiltin = !!findBuiltin(def.id);
    if(isBuiltin) wrap.classList.add('builtin');
    if(jiggleMode) wrap.classList.add('jiggle');
    var disp = displayIconFor(def);
    var glyph = el('div','glyph', disp.photo ? '' : disp.icon);
    if(disp.photo){ glyph.style.backgroundImage = 'url('+disp.photo+')'; }
    var label = el('div','label', disp.name);
    var rx = el('div','remove-x','&times;');
    var pencil = el('div','edit-pencil','\u270E');
    wrap.appendChild(glyph); wrap.appendChild(label); wrap.appendChild(rx); wrap.appendChild(pencil);

    wrap.addEventListener('click', function(e){
      if(jiggleMode){
        if(e.target === rx && !isBuiltin){ uninstallApp(def.id); }
        else if(e.target === pencil){ openIconEditor(def); }
        return;
      }
      glyph.classList.add('pressed');
      setTimeout(function(){glyph.classList.remove('pressed');}, 120);
      launchApp(def.id);
    });

    container.appendChild(wrap);
  }

  /* ---- drag-to-reorder + swipe paging (touch) ---- */
  function deviceBox(){ return $('#device').getBoundingClientRect(); }

  function startIconDrag(wrapEl, clientX, clientY){
    if(!wrapEl) return;
    var id = wrapEl.dataset.id;
    var rect = wrapEl.getBoundingClientRect();
    var dbox = deviceBox();
    var ghost = wrapEl.cloneNode(true);
    ghost.className = 'app-icon drag-ghost';
    ghost.style.left = (rect.left - dbox.left) + 'px';
    ghost.style.top = (rect.top - dbox.top) + 'px';
    ghost.style.width = rect.width + 'px';
    $('#device').appendChild(ghost);

    var glLeft = el('div','edge-glow left');
    var glRight = el('div','edge-glow right');
    $('#home-scroll').appendChild(glLeft);
    $('#home-scroll').appendChild(glRight);

    iconDrag = {
      id: id,
      ghost: ghost,
      glLeft: glLeft, glRight: glRight,
      deviceBox: dbox,
      grabX: clientX - rect.left,
      grabY: clientY - rect.top
    };
    wrapEl.style.opacity = '0';
    sfx('tap');
    if(state.vibration && navigator.vibrate) navigator.vibrate(30);
  }

  function updateIconDrag(clientX, clientY){
    if(!iconDrag) return;
    var db = iconDrag.deviceBox;
    iconDrag.ghost.style.left = (clientX - db.left - iconDrag.grabX) + 'px';
    iconDrag.ghost.style.top = (clientY - db.top - iconDrag.grabY) + 'px';

    var margin = 30;
    var nearLeft = (clientX - db.left) < margin;
    var nearRight = (db.right - clientX) < margin;
    iconDrag.glLeft.classList.toggle('show', nearLeft && currentPageIndex>0);
    iconDrag.glRight.classList.toggle('show', nearRight);

    if(nearLeft || nearRight){
      var side = nearLeft ? 'left' : 'right';
      if(edgeHoldSide !== side){
        clearTimeout(edgeHoldTimer);
        edgeHoldSide = side;
        edgeHoldTimer = setTimeout(function(){
          var pages = computePages();
          if(side==='left' && currentPageIndex>0){ currentPageIndex--; }
          else if(side==='right' && currentPageIndex<pages.length-1){ currentPageIndex++; }
          updateTrackPosition(true);
          renderPageDots(pages.length);
          edgeHoldSide = null;
        }, 550);
      }
    } else {
      clearTimeout(edgeHoldTimer);
      edgeHoldSide = null;
    }

    iconDrag.ghost.style.visibility = 'hidden';
    var underEl = document.elementFromPoint(clientX, clientY);
    iconDrag.ghost.style.visibility = '';
    var hoverIcon = underEl ? underEl.closest('.app-icon') : null;
    if(hoverIcon && hoverIcon.dataset.id && hoverIcon.dataset.id !== iconDrag.id){
      var flatOrder = state.iconOrder.slice();
      var fromIdx = flatOrder.indexOf(iconDrag.id);
      var toIdx = flatOrder.indexOf(hoverIcon.dataset.id);
      if(fromIdx>-1 && toIdx>-1 && fromIdx!==toIdx){
        flatOrder.splice(fromIdx,1);
        flatOrder.splice(toIdx,0,iconDrag.id);
        state.iconOrder = flatOrder;
        renderHomePagesOnly();
      }
    }
  }

  function finishIconDrag(){
    if(!iconDrag) return;
    clearTimeout(edgeHoldTimer);
    edgeHoldSide = null;
    iconDrag.ghost.remove();
    iconDrag.glLeft.remove();
    iconDrag.glRight.remove();
    iconDrag = null;
    saveState();
    renderHomePagesOnly();
  }

  var homeTrackEl = null;
  function initHomeTouchHandlers(){
    homeTrackEl = $('#home-pages-track');
    if(!homeTrackEl) return;

    homeTrackEl.addEventListener('touchstart', function(e){
      var iconEl = e.target.closest('.app-icon');
      var t = e.touches[0];
      touchTrackState = { startX:t.clientX, startY:t.clientY, startPageIndex:currentPageIndex, dragging:false, startedOnIcon:!!iconEl };

      if(iconEl){
        jigglePressIcon = iconEl;
        if(!jiggleMode){
          clearTimeout(jigglePressTimer);
          jigglePressTimer = setTimeout(function(){
            jiggleMode = true;
            sfx('toggle');
            renderHomePagesOnly();
            var freshEl = document.querySelector('.app-icon[data-id="'+iconEl.dataset.id+'"]');
            startIconDrag(freshEl, t.clientX, t.clientY);
          }, 500);
        }
      }
    }, {passive:true});

    homeTrackEl.addEventListener('touchmove', function(e){
      if(!touchTrackState) return;
      var t = e.touches[0];
      var dx = t.clientX - touchTrackState.startX;
      var dy = t.clientY - touchTrackState.startY;

      if(iconDrag){
        e.preventDefault();
        updateIconDrag(t.clientX, t.clientY);
        return;
      }

      if(touchTrackState.startedOnIcon && jiggleMode && jigglePressIcon && !iconDrag){
        if(Math.abs(dx) > 10 || Math.abs(dy) > 10){
          clearTimeout(jigglePressTimer);
          startIconDrag(jigglePressIcon, t.clientX, t.clientY);
          e.preventDefault();
          return;
        }
        return;
      }

      if(touchTrackState.startedOnIcon && !jiggleMode){
        // still waiting to see if this becomes a long-press; do not swipe pages from an icon touch
        if(Math.abs(dx) > 10 || Math.abs(dy) > 10){ clearTimeout(jigglePressTimer); }
        return;
      }

      if(!touchTrackState.startedOnIcon && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10){
        touchTrackState.dragging = true;
        var track = $('#home-pages-track');
        track.style.transition = 'none';
        var pct = (dx / track.offsetWidth) * 100;
        track.style.transform = 'translateX(' + (-touchTrackState.startPageIndex*100 + pct) + '%)';
        e.preventDefault();
      }
    }, {passive:false});

    homeTrackEl.addEventListener('touchend', function(e){
      clearTimeout(jigglePressTimer);
      if(iconDrag){
        finishIconDrag();
        jigglePressIcon = null;
        touchTrackState = null;
        return;
      }
      if(touchTrackState && touchTrackState.dragging){
        var t = e.changedTouches[0];
        var dx = t.clientX - touchTrackState.startX;
        var track = $('#home-pages-track');
        track.style.transition = '';
        var pages = computePages();
        var threshold = track.offsetWidth * 0.16;
        var newIndex = touchTrackState.startPageIndex;
        if(dx < -threshold && newIndex < pages.length-1) newIndex++;
        else if(dx > threshold && newIndex > 0) newIndex--;
        currentPageIndex = newIndex;
        updateTrackPosition(true);
        renderPageDots(pages.length);
      }
      jigglePressIcon = null;
      touchTrackState = null;
    }, {passive:true});

    homeTrackEl.addEventListener('touchcancel', function(){
      clearTimeout(jigglePressTimer);
      if(iconDrag) finishIconDrag();
      jigglePressIcon = null;
      touchTrackState = null;
    }, {passive:true});
  }

  function fsGetFolder(path){
    var node = {type:'folder', children:FS};
    for(var i=0;i<path.length;i++){
      node = node.children[path[i]];
      if(!node) return null;
    }
    return node;
  }
  function fsFolderChildren(path){
    var f = fsGetFolder(path);
    return f ? f.children : null;
  }

  /* ===================== CAMERA ===================== */
  function applyDisposableFx(canvas){
    var w = canvas.width, h = canvas.height;
    var ctx = canvas.getContext('2d');
    // warm cast + vignette
    var vg = ctx.createRadialGradient(w/2,h/2, Math.min(w,h)*0.25, w/2,h/2, Math.max(w,h)*0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(20,14,6,0.55)');
    ctx.fillStyle = 'rgba(232,147,74,0.10)';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,w,h);
    // grain
    var imgData = ctx.getImageData(0,0,w,h);
    var d = imgData.data;
    for(var i=0;i<d.length;i+=4){
      var n = (Math.random()-0.5)*34;
      d[i] = Math.max(0,Math.min(255, d[i]+n));
      d[i+1] = Math.max(0,Math.min(255, d[i+1]+n));
      d[i+2] = Math.max(0,Math.min(255, d[i+2]+n*0.9));
    }
    ctx.putImageData(imgData,0,0);
    // fake date stamp, disposable-camera style
    var d2 = new Date();
    var stamp = (d2.getMonth()+1)+'/'+d2.getDate()+'/'+String(d2.getFullYear()).slice(2);
    ctx.font = 'bold '+Math.max(12,Math.floor(w*0.045))+'px monospace';
    ctx.fillStyle = 'rgba(255,140,40,0.85)';
    ctx.textAlign = 'right';
    ctx.fillText(stamp, w-10, h-12);
  }

  function renderCamera(){
    var body = $('#app-body');
    body.innerHTML = '';
    var wrap = el('div');
    wrap.appendChild(el('h2','','CAMERA'));

    var camMode = 'photo'; // 'photo' | 'video'
    var camFacing = 'environment'; // 'environment' | 'user'

    var modeTabs = el('div','cam-mode-tabs');
    var photoTab = el('div','btn98 accent','Photo');
    var videoTab = el('div','btn98','Video');
    modeTabs.appendChild(photoTab); modeTabs.appendChild(videoTab);
    wrap.appendChild(modeTabs);

    var video = document.createElement('video');
    video.id='cam-video'; video.autoplay=true; video.playsInline=true; video.muted=true;
    video.style.filter = 'contrast(1.15) saturate(0.8) sepia(0.12) brightness(1.03)';
    wrap.appendChild(video);

    var controlsRow = el('div','cam-controls-row');
    var flipBtn = el('div','btn98 cam-flip-btn','\u{1F504}');
    var shutter = el('div','cam-shutter');
    controlsRow.appendChild(flipBtn); controlsRow.appendChild(shutter);
    wrap.appendChild(controlsRow);

    var recTimer = el('div','rec-timer','');
    wrap.appendChild(recTimer);

    var hint = el('p','','Starting camera...');
    wrap.appendChild(hint);
    body.appendChild(wrap);

    var mediaRecorder = null, recChunks = [], recStartTs = 0, recInterval = null;
    var MAX_REC_MS = 20000;

    function updateMirror(){
      video.style.transform = camFacing==='user' ? 'scaleX(-1)' : 'none';
    }

    function saveDataUrl(dataUrl){
      var fname = 'photo_'+Date.now()+'.jpg';
      FS.Pictures.children[fname] = {type:'file', kind:'image', data:dataUrl};
      saveState();
      sfx('shutter');
      var flash = $('#cam-flash');
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
      toast('Saved to Photos');
    }

    function processAndSave(sourceCanvas){
      var LOWRES = 380;
      var scale = LOWRES / Math.max(sourceCanvas.width, sourceCanvas.height);
      var out = document.createElement('canvas');
      out.width = Math.round(sourceCanvas.width*scale);
      out.height = Math.round(sourceCanvas.height*scale);
      var octx = out.getContext('2d');
      octx.filter = 'contrast(1.15) saturate(0.8) sepia(0.12) brightness(1.03)';
      if(camFacing==='user'){
        octx.translate(out.width,0); octx.scale(-1,1);
      }
      octx.drawImage(sourceCanvas, 0, 0, out.width, out.height);
      octx.setTransform(1,0,0,1,0,0);
      applyDisposableFx(out);
      saveDataUrl(out.toDataURL('image/jpeg', 0.5));
    }

    function simulateShot(){
      var c = document.createElement('canvas'); c.width=320; c.height=320;
      var cx = c.getContext('2d');
      var colors = ['#f2c85b','#e8935a','#6fae8f','#4a6a94','#c98fb0','#b95050'];
      var g = cx.createLinearGradient(0,0,320,320);
      g.addColorStop(0, colors[Math.floor(Math.random()*colors.length)]);
      g.addColorStop(1, colors[Math.floor(Math.random()*colors.length)]);
      cx.fillStyle=g; cx.fillRect(0,0,320,320);
      processAndSave(c);
    }

    function takePhoto(){
      var c = document.createElement('canvas');
      c.width = video.videoWidth || 320; c.height = video.videoHeight || 320;
      c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
      processAndSave(c);
    }

    function stopRecordingUI(){
      clearInterval(recInterval);
      recTimer.textContent = '';
      shutter.classList.remove('recording');
    }

    function saveVideoBlob(blob){
      var reader = new FileReader();
      reader.onload = function(){
        var fname = 'video_'+Date.now()+'.webm';
        FS.Videos.children[fname] = {type:'file', kind:'video', data:reader.result, mime:'video/webm'};
        try{ saveState(); toast('Saved to Videos'); }
        catch(e){ toast('Video is large -- saved for this session only'); }
        if(blob.size > 2500000){
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = fname;
          document.body.appendChild(a); a.click(); a.remove();
          toast('Also downloaded a copy (large file)');
        }
        renderCamera();
      };
      reader.readAsDataURL(blob);
    }

    function startRecording(stream){
      if(!window.MediaRecorder){ toast('Video recording not supported in this browser'); return; }
      recChunks = [];
      var options = {};
      try{
        if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) options.mimeType='video/webm;codecs=vp8,opus';
        else if(MediaRecorder.isTypeSupported('video/webm')) options.mimeType='video/webm';
      }catch(e){}
      options.videoBitsPerSecond = 400000;
      try{ mediaRecorder = new MediaRecorder(stream, options); }
      catch(e){ mediaRecorder = new MediaRecorder(stream); }
      mediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size) recChunks.push(e.data); };
      mediaRecorder.onstop = function(){
        stopRecordingUI();
        var blob = new Blob(recChunks, {type:'video/webm'});
        saveVideoBlob(blob);
      };
      mediaRecorder.start();
      recStartTs = Date.now();
      shutter.classList.add('recording');
      sfx('shutter');
      recInterval = setInterval(function(){
        var elapsed = Date.now()-recStartTs;
        var secs = Math.floor(elapsed/1000);
        recTimer.textContent = '\u25CF REC '+secs+'s';
        if(elapsed >= MAX_REC_MS) stopRecording();
      }, 200);
    }
    function stopRecording(){
      if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
    }

    function wireShutter(){
      shutter.onclick = function(){
        if(camMode==='photo'){ takePhoto(); return; }
        if(!activeCameraStream){ toast('Camera not available -- cannot record'); return; }
        if(mediaRecorder && mediaRecorder.state==='recording'){ stopRecording(); }
        else { startRecording(activeCameraStream); }
      };
    }
    wireShutter();

    photoTab.addEventListener('click', function(){
      if(mediaRecorder && mediaRecorder.state==='recording') stopRecording();
      camMode='photo'; photoTab.classList.add('accent'); videoTab.classList.remove('accent');
      shutter.classList.remove('rec-mode');
      startStream();
    });
    videoTab.addEventListener('click', function(){
      camMode='video'; videoTab.classList.add('accent'); photoTab.classList.remove('accent');
      shutter.classList.add('rec-mode');
      startStream();
    });

    function startStream(){
      if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
        hint.textContent = 'Camera API not available in this browser context (needs https, not file://).';
        var b0 = el('div','btn98 accent full','Simulate Photo Instead');
        b0.addEventListener('click', simulateShot);
        shutter.replaceWith(b0);
        flipBtn.style.display='none';
        return;
      }
      stopCamera();
      hint.textContent = 'Starting camera...';
      navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing}, audio:(camMode==='video')}).then(function(stream){
        activeCameraStream = stream;
        video.srcObject = stream;
        updateMirror();
        hint.textContent = camFacing==='user' ? 'Front camera -- say cheese.' : 'Tap the shutter for that cheap disposable-camera look.';
      }).catch(function(err){
        hint.textContent = 'Camera unavailable (' + err.name + '). This page needs to be served over https (or localhost) for real camera access when opened directly from a file, that permission is usually blocked.';
        var b = el('div','btn98 accent full','Simulate Photo Instead');
        b.addEventListener('click', simulateShot);
        if(shutter.parentNode) shutter.replaceWith(b);
        flipBtn.style.display='none';
      });
    }

    flipBtn.addEventListener('click', function(){
      if(mediaRecorder && mediaRecorder.state==='recording'){ toast('Stop recording before flipping'); return; }
      camFacing = camFacing==='environment' ? 'user' : 'environment';
      sfx('toggle');
      startStream();
    });

    startStream();
  }

  var browserHistory = [], browserIndex = -1;
  function normalizeUrl(v){
    v = (v||'').trim();
    if(!v) return null;
    if(/^https?:\/\//i.test(v)) return v;
    if(/^[a-z0-9-]+(\.[a-z0-9-]+)+([\/?#].*)?$/i.test(v) && v.indexOf(' ')===-1) return 'https://'+v;
    return 'https://duckduckgo.com/html/?q='+encodeURIComponent(v);
  }

    var hint = el('div','', 'Some sites (Google, most social apps) refuse to be shown inside other pages at all -- that\'s a security header on their end, not something any embedded browser can bypass. Use "Open in real tab" below for those.');
    hint.style.cssText='font-size:13px; color:var(--ink-soft); margin-bottom:8px;';
    wrap.appendChild(hint);

    var openTabBtn = el('div','btn98 accent full','\u2197 Open in real browser tab');
    openTabBtn.addEventListener('click', function(){
      if(iframe.src && iframe.src!=='about:blank') window.open(iframe.src, '_blank');
      else toast('Load a page first');
    });
    openTabRow.appendChild(openTabBtn);
    wrap.appendChild(openTabRow);
    body.appendChild(wrap);

    function go_to(url, pushHistory){
      var u = normalizeUrl(url);
      if(!u) return;
      iframe.src = u;
      input.value = u;
      if(pushHistory!==false){
        browserHistory = browserHistory.slice(0, browserIndex+1);
        browserHistory.push(u);
        browserIndex = browserHistory.length-1;
      }
      sfx('click');
    }
    go.addEventListener('click', function(){ go_to(input.value); });
    input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ go_to(input.value); } });
    backBtn.addEventListener('click', function(){ if(browserIndex>0){ browserIndex--; go_to(browserHistory[browserIndex], false); } });
    fwdBtn.addEventListener('click', function(){ if(browserIndex<browserHistory.length-1){ browserIndex++; go_to(browserHistory[browserIndex], false); } });
    reloadBtn.addEventListener('click', function(){ if(iframe.src){ var s=iframe.src; iframe.src='about:blank'; setTimeout(function(){iframe.src=s;},30); } });
    fullscreenBtn.addEventListener('click', function(){
      if(!iframe.src || iframe.src==='about:blank'){ toast('Load a page first'); return; }
      var req = iframe.requestFullscreen || iframe.webkitRequestFullscreen || iframe.webkitRequestFullScreen || iframe.mozRequestFullScreen || iframe.msRequestFullscreen;
      if(!req){ toast('Fullscreen is not supported in this browser'); return; }
      try{
        var result = req.call(iframe);
        if(result && result.catch){ result.catch(function(){ toast('Fullscreen was blocked -- try tapping the page first'); }); }
        sfx('click');
      }catch(e){ toast('Fullscreen was blocked -- try tapping the page first'); }
    });

    if(browserHistory.length){ input.value = browserHistory[browserIndex]; iframe.src = browserHistory[browserIndex]; }
    else { go_to('https://en.wikipedia.org/wiki/Special:Random'); }
  }
