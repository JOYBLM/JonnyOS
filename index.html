  /* ===================== PHONE (dial pad, simulated calls, and real WebRTC calls) ===================== */
  var phoneCallState = 'idle'; // idle | ringing | connected
  var phoneCallName = '', phoneCallNumber = '';
  var phoneCallSeconds = 0;
  var phoneCallTimerId = null, phoneRingTimeoutId = null, phoneRingSoundId = null;
  var phoneDialed = '';
  var phoneCallIsReal = false;
  var phoneMuted = false;

  // --- Real call (WebRTC + Firebase signaling) state ---
  var ICE_SERVERS = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]};
  var rtcPc = null, localMicStream = null, remoteAudioEl = null;
  var currentCallConvId = null, currentCallOtherUid = null;
  var callFbListeners = [];
  var incomingCallRingId = null;

  function fmtCallTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function stopPhoneRingSound(){
    clearInterval(phoneRingSoundId); phoneRingSoundId = null;
  }
  function clearCallFbListeners(){
    callFbListeners.forEach(function(l){ try{ l.ref.off(l.event, l.cb); }catch(e){} });
    callFbListeners = [];
  }

  function startCall(name, number, contact){
    if(contact && contact.realUid){ startRealCall(contact); return; }
    if(!number){ toast('No number to call'); return; }
    phoneCallName = name || number;
    phoneCallNumber = number;
    phoneCallState = 'ringing';
    phoneCallIsReal = false;
    if(state.currentApp !== 'phone') launchApp('phone'); else renderPhone();
    phoneRingSoundId = setInterval(function(){ sfx('ring'); if(state.vibration && navigator.vibrate) navigator.vibrate(200); }, 1200);
    phoneRingTimeoutId = setTimeout(connectCall, 2600);
  }
  function connectCall(){
    stopPhoneRingSound();
    if(phoneCallState !== 'ringing') return;
    phoneCallState = 'connected';
    phoneCallSeconds = 0;
    sfx('unlock');
    renderPhone();
    clearInterval(phoneCallTimerId);
    phoneCallTimerId = setInterval(function(){
      phoneCallSeconds++;
      var t = $('#call-timer');
      if(t) t.textContent = fmtCallTime(phoneCallSeconds);
    }, 1000);
  }
  function endCall(){
    if(phoneCallIsReal){ endRealCall(true); return; }
    stopPhoneRingSound();
    clearTimeout(phoneRingTimeoutId); phoneRingTimeoutId = null;
    clearInterval(phoneCallTimerId); phoneCallTimerId = null;
    phoneCallState = 'idle';
    sfx('close');
    renderPhone();
  }

  /* ---- Real WebRTC calling ---- */
  function createPeerConnection(convId, otherUid){
    var pc = new RTCPeerConnection(ICE_SERVERS);
    pc.onicecandidate = function(e){
      if(e.candidate){ fbDb.ref('calls/'+convId+'/candidates/'+getMyUid()).push(e.candidate.toJSON()); }
    };
    pc.ontrack = function(e){
      if(!remoteAudioEl){ remoteAudioEl = document.createElement('audio'); remoteAudioEl.autoplay = true; document.body.appendChild(remoteAudioEl); }
      remoteAudioEl.srcObject = e.streams[0];
    };
    pc.onconnectionstatechange = function(){
      if(pc.connectionState === 'connected' && phoneCallState==='ringing'){ connectCall(); }
      if((pc.connectionState === 'failed') && phoneCallState !== 'idle'){
        toast('Call connection failed -- this can happen on some networks');
        endRealCall(true);
      }
    };
    var candRef = fbDb.ref('calls/'+convId+'/candidates/'+otherUid);
    var candCb = candRef.on('child_added', function(snap){
      var c = snap.val();
      if(c){ pc.addIceCandidate(new RTCIceCandidate(c)).catch(function(){}); }
    });
    callFbListeners.push({ref:candRef, event:'child_added', cb:candCb});
    return pc;
  }
  function startRealCall(contact){
    if(!fbReady){ toast('Real chat is not connected right now'); return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Microphone access needs https (or localhost), not a local file'); return; }
    if(typeof RTCPeerConnection === 'undefined'){ toast('Calling is not supported in this browser'); return; }
    var convId = convIdFor(contact.realUid);
    if(!convId) return;
    phoneCallName = contact.name;
    phoneCallNumber = contact.number || '';
    phoneCallState = 'ringing';
    phoneCallIsReal = true;
    currentCallConvId = convId;
    currentCallOtherUid = contact.realUid;
    if(state.currentApp !== 'phone') launchApp('phone'); else renderPhone();
    stopPhoneRingSound();
    phoneRingSoundId = setInterval(function(){ sfx('ring'); }, 1200);

    // Clear any leftover data from a previous call on this conversation before starting fresh,
    // and only THEN create the peer connection -- this avoids a race where ICE candidates
    // generated during setup could otherwise be wiped out by the offer write that follows.
    fbDb.ref('calls/'+convId).remove().then(function(){
      return navigator.mediaDevices.getUserMedia({audio:true});
    }).then(function(stream){
      localMicStream = stream;
      rtcPc = createPeerConnection(convId, contact.realUid);
      stream.getTracks().forEach(function(t){ rtcPc.addTrack(t, stream); });
      return rtcPc.createOffer();
    }).then(function(offer){
      return rtcPc.setLocalDescription(offer).then(function(){ return offer; });
    }).then(function(offer){
      var me = getMyAccount();
      fbDb.ref('calls/'+convId).update({offer:{sdp:offer.sdp, type:offer.type}, status:'ringing'});
      fbDb.ref('callInvites/'+contact.realUid+'/'+convId).set({fromUid:getMyUid(), fromName:(me?me.name:'Someone'), fromAvatar:(me?me.avatar:'\u{1F464}'), ts:Date.now()});

      var answerRef = fbDb.ref('calls/'+convId+'/answer');
      var answerCb = answerRef.on('value', function(snap){
        var ans = snap.val();
        if(ans && rtcPc && !rtcPc.currentRemoteDescription){
          rtcPc.setRemoteDescription(new RTCSessionDescription(ans)).catch(function(){});
        }
      });
      callFbListeners.push({ref:answerRef, event:'value', cb:answerCb});

      var statusRef = fbDb.ref('calls/'+convId+'/status');
      var statusCb = statusRef.on('value', function(snap){
        var st = snap.val();
        if(st==='declined'){ toast(contact.name+' declined the call'); endRealCall(false); }
        else if(st==='ended' && phoneCallState!=='idle'){ endRealCall(false); }
      });
      callFbListeners.push({ref:statusRef, event:'value', cb:statusCb});
    }).catch(function(err){
      toast('Could not start the call (' + (err && (err.code || err.message || err.name) ? (err.code || err.message || err.name) : 'unknown error') + ')');
      endRealCall(false);
    });
  }
  function acceptIncomingCall(convId, fromUid, fromName){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Microphone access needs https (or localhost), not a local file'); return; }
    if(typeof RTCPeerConnection === 'undefined'){ toast('Calling is not supported in this browser'); return; }
    phoneCallName = fromName;
    phoneCallNumber = '';
    phoneCallState = 'ringing';
    phoneCallIsReal = true;
    currentCallConvId = convId;
    currentCallOtherUid = fromUid;
    launchApp('phone');

    if(fbReady) fbDb.ref('callInvites/'+getMyUid()+'/'+convId).remove();

    fbDb.ref('calls/'+convId+'/offer').once('value').then(function(snap){
      var offer = snap.val();
      if(!offer){ toast('The call ended before it connected'); endRealCall(false); return; }
      return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
        localMicStream = stream;
        rtcPc = createPeerConnection(convId, fromUid);
        stream.getTracks().forEach(function(t){ rtcPc.addTrack(t, stream); });
        return rtcPc.setRemoteDescription(new RTCSessionDescription(offer));
      }).then(function(){
        return rtcPc.createAnswer();
      }).then(function(answer){
        return rtcPc.setLocalDescription(answer).then(function(){ return answer; });
      }).then(function(answer){
        fbDb.ref('calls/'+convId+'/answer').set({sdp:answer.sdp, type:answer.type});
        fbDb.ref('calls/'+convId+'/status').set('accepted');
        var statusRef = fbDb.ref('calls/'+convId+'/status');
        var statusCb = statusRef.on('value', function(snap2){
          if(snap2.val()==='ended' && phoneCallState!=='idle'){ endRealCall(false); }
        });
        callFbListeners.push({ref:statusRef, event:'value', cb:statusCb});
      });
    }).catch(function(err){
      toast('Could not answer the call (' + (err && (err.code || err.message || err.name) ? (err.code || err.message || err.name) : 'unknown error') + ')');
      endRealCall(false);
    });
  }
  function declineIncomingCall(convId){
    if(fbReady){
      fbDb.ref('calls/'+convId+'/status').set('declined');
      fbDb.ref('callInvites/'+getMyUid()+'/'+convId).remove();
    }
  }
  function endRealCall(notifyOther){
    if(fbReady && currentCallConvId){
      if(notifyOther!==false){
        fbDb.ref('calls/'+currentCallConvId+'/status').set('ended');
      }
      if(currentCallOtherUid) fbDb.ref('callInvites/'+currentCallOtherUid+'/'+currentCallConvId).remove();
      var myUidNow = getMyUid();
      if(myUidNow) fbDb.ref('callInvites/'+myUidNow+'/'+currentCallConvId).remove();
    }
    clearCallFbListeners();
    if(rtcPc){ try{ rtcPc.close(); }catch(e){} rtcPc = null; }
    if(localMicStream){ localMicStream.getTracks().forEach(function(t){ t.stop(); }); localMicStream = null; }
    if(remoteAudioEl){ remoteAudioEl.srcObject = null; }
    currentCallConvId = null; currentCallOtherUid = null;
    phoneCallIsReal = false;
    phoneMuted = false;
    clearInterval(phoneCallTimerId); phoneCallTimerId = null;
    stopPhoneRingSound();
    phoneCallState = 'idle';
    sfx('close');
    renderPhone();
  }
  function toggleMute(){
    phoneMuted = !phoneMuted;

  function attachIncomingCallListener(){

        sendRealMessage(contact, text);
        return;

      var key = contactKey(contact);
      if(!state.messages[key]) state.messages[key] = [];
      state.messages[key].push({from:'me', text:text, time:Date.now()});
      saveState();
      draw();

      var typingBubble = el('div','msg-bubble them typing','typing...');
      scroll.appendChild(typingBubble);
      scroll.scrollTop = scroll.scrollHeight;

      setTimeout(function(){

        state.messages[key].push({from:'them', text:reply, time:Date.now()});

          draw();
          sfx('notify');
        } else {
          pushNotification('messages', '\u{1F4AC}', contact.name+': '+reply);
        }
      }, 1200 + Math.random()*1400);
    }
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') sendMessage(); });

  /* ===================== CLOCK (stopwatch + timer) ===================== */
  var clockTab = 'stopwatch';
  var sw = {running:false, startTs:0, elapsed:0, laps:[]};
  var tmr = {running:false, remaining:0, total:0, id:null};
  function fmtMs(ms){
    var cs = Math.floor(ms/10)%100, s = Math.floor(ms/1000)%60, m = Math.floor(ms/60000);
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+(cs<10?'0':'')+cs;
  }
  function fmtSec(s){
    var m = Math.floor(s/60), sec = s%60;
    return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
  }
  var clockRedrawTimer = null;
  function renderClock(){
    var body = $('#app-body');
    body.innerHTML = '';
    var wrap = el('div');
    wrap.appendChild(el('h2','','CLOCK'));
    var tabs = el('div','tabbar');
    var tSw = el('div','btn98'+(clockTab==='stopwatch'?' accent':''),'Stopwatch');
    var tTm = el('div','btn98'+(clockTab==='timer'?' accent':''),'Timer');
    tSw.addEventListener('click', function(){ clockTab='stopwatch'; renderClock(); });
    tTm.addEventListener('click', function(){ clockTab='timer'; renderClock(); });
    tabs.appendChild(tSw); tabs.appendChild(tTm);
    wrap.appendChild(tabs);

    if(clockTab==='stopwatch'){
      var disp = el('div','big-timer', fmtMs(sw.running ? (sw.elapsed + (Date.now()-sw.startTs)) : sw.elapsed));
      wrap.appendChild(disp);
      var row = el('div'); row.style.cssText='display:flex; gap:8px; justify-content:center;';
      var startBtn = el('div','btn98 accent', sw.running?'Lap':'Start');
      var stopBtn = el('div','btn98', sw.running?'Stop':'Reset');
      startBtn.addEventListener('click', function(){
        if(sw.running){ sw.laps.unshift(fmtMs(sw.elapsed + (Date.now()-sw.startTs))); }
        else { sw.running=true; sw.startTs=Date.now(); }
        renderClock();
      });
      stopBtn.addEventListener('click', function(){
        if(sw.running){ sw.elapsed += Date.now()-sw.startTs; sw.running=false; }
        else { sw.elapsed=0; sw.laps=[]; }
        renderClock();
      });
      row.appendChild(startBtn); row.appendChild(stopBtn);
      wrap.appendChild(row);
      if(sw.laps.length){
        var lapsPanel = el('div','panel'); lapsPanel.style.marginTop='12px';
        sw.laps.forEach(function(l,i){ var r=el('div','row'); r.innerHTML='<div>Lap '+(sw.laps.length-i)+'</div><div>'+l+'</div>'; lapsPanel.appendChild(r); });
        wrap.appendChild(lapsPanel);
      }
      clearInterval(clockRedrawTimer);
      if(sw.running){ clockRedrawTimer = setInterval(function(){ if(state.currentApp==='clock' && clockTab==='stopwatch') renderClock(); }, 300); }
    } else {
      var disp2 = el('div','big-timer', fmtSec(tmr.running ? tmr.remaining : (tmr.total||300)));
      wrap.appendChild(disp2);
      if(!tmr.running){
        var setRow = el('div'); setRow.style.cssText='display:flex; gap:8px; justify-content:center; margin-bottom:10px;';
        [60,300,600].forEach(function(s){
          var b = el('div','btn98', fmtSec(s));
          b.addEventListener('click', function(){ tmr.total=s; renderClock(); });
          setRow.appendChild(b);
        });
        wrap.appendChild(setRow);
      }
      var row2 = el('div'); row2.style.cssText='display:flex; gap:8px; justify-content:center;';
      var goBtn = el('div','btn98 accent', tmr.running?'Pause':'Start');
      goBtn.addEventListener('click', function(){
        if(tmr.running){ clearInterval(tmr.id); tmr.running=false; renderClock(); return; }
        if(!tmr.remaining) tmr.remaining = tmr.total || 300;
        tmr.running = true;
        tmr.id = setInterval(function(){
          tmr.remaining--;
          if(tmr.remaining<=0){ clearInterval(tmr.id); tmr.running=false; tmr.remaining=0; beep(); toast('Time is up!'); }
          if(state.currentApp==='clock' && clockTab==='timer') renderClock();
        }, 1000);
        renderClock();
      });
      var resetBtn2 = el('div','btn98','Reset');
      resetBtn2.addEventListener('click', function(){ clearInterval(tmr.id); tmr.running=false; tmr.remaining=0; renderClock(); });
      row2.appendChild(goBtn); row2.appendChild(resetBtn2);
      wrap.appendChild(row2);
    }
    body.appendChild(wrap);
  }
  function beep(){
    try{
      var ctx = getAudioCtx();
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.frequency.value = 880; osc.type='square';
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.5);
      osc.connect(g).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+0.5);
    }catch(e){}
  }

  /* ===================== MUSIC (plays real imported audio + built-in synth tracks, all from FS.Music) ===================== */
  var audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  var masterGain = null;
  function getMasterGain(){
    var ctx = getAudioCtx();
    if(!masterGain){ masterGain = ctx.createGain(); masterGain.gain.value = state.volume/100*0.18; masterGain.connect(ctx.destination); }
    return masterGain;
  }
  // note frequencies, used only to seed the default built-in tracks below
  var N = {C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
           C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00, R:0};
  var DEFAULT_TRACKS = [
    {file:'01 Dial-Up Dreams.synth', artist:'The Cathode Rays',
     notes:[[N.C4,.3],[N.E4,.3],[N.G4,.3],[N.C5,.4],[N.G4,.3],[N.E4,.3],[N.C4,.4],[N.R,.2],
            [N.D4,.3],[N.F4,.3],[N.A4,.3],[N.D5,.4],[N.A4,.3],[N.F4,.3],[N.D4,.4],[N.R,.2]]},
    {file:'02 Beige Box Boogie.synth', artist:'Analog Static',
     notes:[[N.E4,.2],[N.G4,.2],[N.B4,.2],[N.E5,.3],[N.B4,.2],[N.G4,.2],[N.E4,.3],[N.R,.15],
            [N.F4,.2],[N.A4,.2],[N.C5,.2],[N.F5,.3],[N.C5,.2],[N.A4,.2],[N.F4,.3],[N.R,.15]]},
    {file:'03 Y2K Sunset.synth', artist:'Modem Chorus',
     notes:[[N.A4,.35],[N.C5,.35],[N.E5,.5],[N.C5,.35],[N.A4,.5],[N.R,.2],
            [N.F4,.35],[N.A4,.35],[N.C5,.5],[N.A4,.35],[N.F4,.5],[N.R,.2]]},
    {file:'04 Floppy Disk Love.synth', artist:'8-Bit Hearts',
     notes:[[N.G4,.25],[N.C5,.25],[N.E5,.25],[N.G5,.4],[N.E5,.25],[N.C5,.25],[N.G4,.4],[N.R,.2],
            [N.A4,.25],[N.D5,.25],[N.F5,.25],[N.A5,.4],[N.F5,.25],[N.D5,.25],[N.A4,.4],[N.R,.2]]}
  ];
  function ensureDefaultTracks(){
    var kids = FS.Music.children;
    var hasSynth = Object.keys(kids).some(function(n){ return kids[n] && kids[n].kind==='synth'; });
    if(!hasSynth){
      DEFAULT_TRACKS.forEach(function(t){
        kids[t.file] = {type:'file', kind:'synth', artist:t.artist, notes:t.notes};
      });
    }
  }
  function musicPlaylist(){
    var kids = FS.Music.children;
    return Object.keys(kids).filter(function(n){
      var node = kids[n];
      return node && node.type==='file' && (node.kind==='synth' || node.kind==='audio');
    }).sort().map(function(n){ return {name:n, node:kids[n]}; });
  }
  function trackDisplayName(name){
    return name.replace(/\.synth$/i,'').replace(/\.(mp3|m4a|wav|ogg|aac|flac|webm)$/i,'').replace(/^\d+\s+/, '');
  }
  function getCurrentTrackEntry(){
    var list = musicPlaylist();
    if(!list.length) return null;
    if(state.musicTrack>=list.length || state.musicTrack<0) state.musicTrack = 0;
    return list[state.musicTrack];
  }

  var musicSchedule = {startAt:0, endAt:0, loopTimeout:null, progressTimer:null, activeNodes:[]};
  var currentAudioEl = null;
  function stopMusicNodes(){
    musicSchedule.activeNodes.forEach(function(o){ try{o.stop();}catch(e){} });
    musicSchedule.activeNodes = [];
    clearTimeout(musicSchedule.loopTimeout);
  }
  function stopPlayback(){
    stopMusicNodes();
    clearInterval(musicSchedule.progressTimer);
    if(currentAudioEl){ try{ currentAudioEl.pause(); }catch(e){} currentAudioEl.src=''; currentAudioEl=null; }
  }
  function playSynthLoop(node){
    var ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    var gain = getMasterGain();
    var t = ctx.currentTime + 0.05;
    var startAt = t;
    node.notes.forEach(function(n){
      var freq = n[0], dur = n[1];
      if(freq){
        var osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = freq;
        var ng = ctx.createGain();
        ng.gain.setValueAtTime(0.0001, t);
        ng.gain.linearRampToValueAtTime(1, t+0.02);
        ng.gain.setValueAtTime(1, t+dur*0.6);
        ng.gain.linearRampToValueAtTime(0.0001, t+dur*0.92);
        osc.connect(ng).connect(gain);
        osc.start(t); osc.stop(t+dur);
        musicSchedule.activeNodes.push(osc);
      }
      t += dur;
    });
    musicSchedule.startAt = startAt;
    musicSchedule.endAt = t;
    var totalMs = (t - startAt) * 1000;
    musicSchedule.loopTimeout = setTimeout(function(){
      if(state.musicPlaying) playSynthLoop(node);
    }, totalMs);
  }
  function startPlayback(){
    var entry = getCurrentTrackEntry();
    if(!entry) return;
    if(entry.node.kind==='synth'){
      playSynthLoop(entry.node);
      musicSchedule.progressTimer = setInterval(function(){
        var ctx = getAudioCtx();
        var pi = $('#music-progress-i');
        if(pi){
          var pct = Math.min(100, (ctx.currentTime - musicSchedule.startAt)/(musicSchedule.endAt-musicSchedule.startAt)*100);
          pi.style.width = pct+'%';
        }
      }, 200);
    } else if(entry.node.kind==='audio'){
      currentAudioEl = new Audio(entry.node.data);
      currentAudioEl.volume = state.volume/100;
      currentAudioEl.addEventListener('ended', function(){ if(state.musicPlaying) musicNext(1); });
      currentAudioEl.play().catch(function(){ toast('Could not play this file'); });
      musicSchedule.progressTimer = setInterval(function(){
        var pi = $('#music-progress-i');
        if(pi && currentAudioEl && currentAudioEl.duration){
          pi.style.width = Math.min(100, currentAudioEl.currentTime/currentAudioEl.duration*100)+'%';
        }
      }, 250);
    }
  }
  function musicRefreshUI(){
    var tEl = $('#track-name'), aEl = $('#track-artist'), wc = $('#wheel-center');
    if(!tEl) return;
    var entry = getCurrentTrackEntry();
    var pi = $('#music-progress-i'); if(pi) pi.style.width='0%';
    if(!entry){ tEl.textContent = 'No tracks'; aEl.textContent = 'Import music to get started'; }
    else { tEl.textContent = trackDisplayName(entry.name); aEl.textContent = entry.node.artist || (entry.node.kind==='audio' ? 'Imported audio' : ''); }
    if(wc) wc.innerHTML = state.musicPlaying ? '&#10073;&#10073;' : '&#9658;';
    renderPlaylistPanel();
  }
  function musicSetPlaying(on){
    if(on && !getCurrentTrackEntry()) return;
    state.musicPlaying = on;
    stopPlayback();
    if(on) startPlayback();
    musicRefreshUI();
  }
  function musicNext(dir){
    var list = musicPlaylist();
    if(!list.length) return;
    stopPlayback();
    state.musicTrack = (state.musicTrack + dir + list.length) % list.length;
    if(state.musicPlaying) startPlayback();
    musicRefreshUI();
  }
  function musicSelectTrack(idx){
    stopPlayback();
    state.musicTrack = idx;
    if(state.musicPlaying) startPlayback();
    musicRefreshUI();
  }
  function importAudioFiles(fileList){
    var files = Array.from(fileList);
    var remaining = files.length;
    if(!remaining) return;
    var kids = FS.Music.children;
    files.forEach(function(f){
      var reader = new FileReader();
      reader.onload = function(){
        var name = f.name, n=1;
        while(kids[name]){ name = f.name.replace(/(\.[^.]*)?$/, function(ext){return ' ('+n+')'+(ext||'');}); n++; }
        kids[name] = {type:'file', kind:'audio', data:reader.result, mime:f.type};
        remaining--;
        if(remaining===0){ saveState(); renderMusicPlaylistAfterImport(); toast('Music imported'); }
      };
      reader.readAsDataURL(f);
    });
  }
  function renderMusicPlaylistAfterImport(){
    if(state.currentApp==='music'){ musicRefreshUI(); }
    if(state.currentApp==='files'){ renderFiles(); }
  }
  function renderPlaylistPanel(){
    var panel = $('#music-playlist');
    if(!panel) return;

    var colors = ['#2b3226','#e8935a','#6fae8f','#4a6a94','#b95050','#f2c85b'];

    colors.forEach(function(c){
      var s = el('div'); s.style.cssText='width:32px;height:32px;border-radius:50%;background:'+c+';border:2px solid var(--win-shadow);';

    wrap.appendChild(clearBtn);

    var drawing=false, lastX, lastY;
    function pos(e){
      var r = canvas.getBoundingClientRect();
      var t = e.touches ? e.touches[0] : e;
      return {x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height)};
    }
    function start(e){ drawing=true; var p=pos(e); lastX=p.x; lastY=p.y; }
    function move(e){
      if(!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ctx.strokeStyle=curColor;
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
      lastX=p.x; lastY=p.y;
    }
    function end(){ drawing=false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);

  var snakeState = null, snakeLoop = null;
  var snakeDifficulty = 'normal';
  function renderSnake(){
    var body = $('#app-body');
    body.innerHTML = '';
    var wrap = el('div'); wrap.style.cssText='display:flex; flex-direction:column; align-items:center; gap:12px;';
    wrap.appendChild(el('h2','','SNAKE'));

    var diffRow = el('div','tabbar');
    [['easy','Easy'],['normal','Normal'],['hard','Hard']].forEach(function(d){
      var b = el('div','btn98'+(snakeDifficulty===d[0]?' accent':''), d[1]);

    });
    wrap.appendChild(diffRow);

    var scoreEl = el('div','', 'Score: 0');
    wrap.appendChild(scoreEl);
    var hiEl = el('div','','Best: '+(getHighScore('snake', snakeDifficulty)||0));
    hiEl.style.cssText='font-size:14px; color:var(--ink-soft);';
    wrap.appendChild(hiEl);
    var canvas = document.createElement('canvas');
    var cell = 16, cols=14, rows=14;
    canvas.width = cell*cols; canvas.height = cell*rows;
    wrap.appendChild(canvas);
    var pad = el('div'); pad.style.cssText='display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:6px;';
    var dpad = [['','U',''],['L','','R'],['','D','']];
    dpad.forEach(function(rowArr){
      rowArr.forEach(function(sym){
        var glyphs = {U:'&#9650;',D:'&#9660;',L:'&#9664;',R:'&#9654;'};
        var b = el('div', sym? 'btn98':'', sym?glyphs[sym]:'');
        if(!sym){ b.style.visibility='hidden'; }
        else {
          b.addEventListener('click', function(){
            if(sym==='U') trySetDir(0,-1);
            else if(sym==='D') trySetDir(0,1);
            else if(sym==='L') trySetDir(-1,0);
            else if(sym==='R') trySetDir(1,0);
          });
        }
        pad.appendChild(b);
      });
    });
    wrap.appendChild(pad);
    var restartBtn = el('div','btn98 accent','Restart');
    wrap.appendChild(restartBtn);
    body.appendChild(wrap);

    var ctx = canvas.getContext('2d');
    var lcdHi = '#dbe6d2', ink='#2b3226', accent='#e8935a';
    var speedMs = snakeDifficulty==='easy' ? 220 : (snakeDifficulty==='hard' ? 105 : 160);

    function trySetDir(dx,dy){
      if(!snakeState) return;
      if(snakeState.dx===-dx && snakeState.dy===-dy) return;
      snakeState.pendingDir = {dx:dx,dy:dy};
    }
    function newGame(){
      snakeState = { body:[{x:6,y:7},{x:5,y:7},{x:4,y:7}], dx:1, dy:0, pendingDir:null, food:{x:10,y:7}, score:0, over:false };
      placeFood();
      scoreEl.textContent='Score: 0';
      hiEl.textContent = 'Best: '+(getHighScore('snake', snakeDifficulty)||0);
    }
    function placeFood(){ snakeState.food = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)}; }
    function step(){
      if(!snakeState || snakeState.over) return;
      if(snakeState.pendingDir){ snakeState.dx=snakeState.pendingDir.dx; snakeState.dy=snakeState.pendingDir.dy; snakeState.pendingDir=null; }
      var head = {x: snakeState.body[0].x+snakeState.dx, y: snakeState.body[0].y+snakeState.dy};
      var wraps = snakeDifficulty==='easy';
      if(wraps){ head.x=(head.x+cols)%cols; head.y=(head.y+rows)%rows; }
      if((!wraps && (head.x<0||head.x>=cols||head.y<0||head.y>=rows))||snakeState.body.some(function(s){return s.x===head.x&&s.y===head.y;})){
        snakeState.over = true; sfx('lose');
        if(setHighScoreIfBetter('snake', snakeDifficulty, snakeState.score, true)){
          hiEl.textContent = 'Best: '+snakeState.score+' (new record!)';
        }
        return;
      }
      snakeState.body.unshift(head);
      if(head.x===snakeState.food.x && head.y===snakeState.food.y){
        sfx('eat');
        snakeState.score++; scoreEl.textContent = 'Score: '+snakeState.score; placeFood();
      } else { snakeState.body.pop(); }
    }
    function draw(){
      ctx.fillStyle = lcdHi; ctx.fillRect(0,0,canvas.width,canvas.height);
      if(snakeState){
        ctx.fillStyle = accent;
        ctx.fillRect(snakeState.food.x*cell+2, snakeState.food.y*cell+2, cell-4, cell-4);
        ctx.fillStyle = ink;
        snakeState.body.forEach(function(s){ ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2); });
        if(snakeState.over){
          ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle='#fff'; ctx.font='16px VT323'; ctx.textAlign='center';
          ctx.fillText('GAME OVER - tap Restart', canvas.width/2, canvas.height/2);
        }
      }
    }
    clearInterval(snakeLoop);
    snakeLoop = setInterval(function(){ step(); draw(); }, speedMs);
    restartBtn.addEventListener('click', newGame);

    var sx=0, sy=0;
    canvas.addEventListener('touchstart', function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
    canvas.addEventListener('touchend', function(e){
      var t=e.changedTouches[0]; var dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.abs(dx)>Math.abs(dy)){ trySetDir(dx>0?1:-1,0); } else { trySetDir(0,dy>0?1:-1); }
    }, {passive:true});

    newGame(); draw();
  }

  /* ===================== TIC TAC TOE ===================== */
  var tttDifficulty = 'normal';
  function renderTTT(){
    var body = $('#app-body');
    body.innerHTML = '';
    var wrap = el('div'); wrap.style.cssText='display:flex; flex-direction:column; align-items:center; gap:12px;';
    wrap.appendChild(el('h2','','TIC-TAC-TOE'));

    var diffRow = el('div','tabbar');
    [['easy','Easy'],['normal','Normal'],['hard','Hard']].forEach(function(d){
      var b = el('div','btn98'+(tttDifficulty===d[0]?' accent':''), d[1]);
      b.addEventListener('click', function(){ tttDifficulty=d[0]; renderTTT(); });
      diffRow.appendChild(b);
    });
    wrap.appendChild(diffRow);

    var status = el('div','','Your turn (X)');
    wrap.appendChild(status);
    var rec = (state.highScores.ttt && state.highScores.ttt[tttDifficulty]) || {w:0,l:0,d:0};
    var recEl = el('div','','Record: '+rec.w+'W - '+rec.l+'L - '+rec.d+'D');
    recEl.style.cssText='font-size:14px; color:var(--ink-soft);';
    wrap.appendChild(recEl);
    var grid = el('div'); grid.id='ttt-grid';
    var cells = [];
    var board = Array(9).fill(null);
    var over = false;
    function winner(b){
      var lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for(var i=0;i<lines.length;i++){ var l=lines[i]; if(b[l[0]] && b[l[0]]===b[l[1]] && b[l[1]]===b[l[2]]) return b[l[0]]; }
      if(b.every(function(v){return v;})) return 'draw';
      return null;
    }
    function minimax(b, isMax){
      var w = winner(b);
      if(w==='O') return {score:10};
      if(w==='X') return {score:-10};
      if(w==='draw') return {score:0};
      var moves = [];
      for(var i=0;i<9;i++){
        if(!b[i]){
          b[i] = isMax ? 'O' : 'X';
          var result = minimax(b, !isMax);
          moves.push({idx:i, score:result.score});
          b[i] = null;
        }
      }
      var best = moves[0];
      moves.forEach(function(m){
        if(isMax ? m.score>best.score : m.score<best.score) best = m;
      });
      return best;
    }
    function aiMove(){
      var empties = board.map(function(v,i){return v?null:i;}).filter(function(v){return v!==null;});
      if(!empties.length) return;
      if(tttDifficulty==='easy'){
        board[empties[Math.floor(Math.random()*empties.length)]]='O';
      } else if(tttDifficulty==='hard'){
        var best = minimax(board.slice(), true);
        board[best.idx]='O';
      } else {
        // normal: play well most of the time, occasionally slip up
        if(Math.random()<0.65){
          var best2 = minimax(board.slice(), true);
          board[best2.idx]='O';
        } else {
          board[empties[Math.floor(Math.random()*empties.length)]]='O';
        }
      }
    }
    function render(){ cells.forEach(function(c,i){ c.textContent = board[i]||''; }); }
    for(var i=0;i<9;i++){
      var c = el('div','ttt-cell','');
      (function(idx){
        c.addEventListener('click', function(){
          if(over || board[idx]) return;
          board[idx]='X';
          var w = winner(board);
          if(!w){ aiMove(); w = winner(board); }
          render();
          if(w){
            over=true; status.textContent = w==='draw' ? "It's a draw." : (w==='X' ? 'You win!' : 'Machine wins.');
            sfx(w==='X'?'win':(w==='draw'?'click':'lose'));
            if(!state.highScores.ttt) state.highScores.ttt = {};
            if(!state.highScores.ttt[tttDifficulty]) state.highScores.ttt[tttDifficulty] = {w:0,l:0,d:0};
            var rr = state.highScores.ttt[tttDifficulty];
            if(w==='X') rr.w++; else if(w==='draw') rr.d++; else rr.l++;
            saveState();
            recEl.textContent = 'Record: '+rr.w+'W - '+rr.l+'L - '+rr.d+'D';
          }
          else { status.textContent = 'Your turn (X)'; }
        });
      })(i);
      cells.push(c); grid.appendChild(c);
    }
    wrap.appendChild(grid);
    var restart = el('div','btn98 accent','New Game');
    restart.addEventListener('click', function(){ board=Array(9).fill(null); over=false; status.textContent='Your turn (X)'; render(); });
    wrap.appendChild(restart);
    body.appendChild(wrap);
  }

  /* ===================== MINESWEEPER ===================== */
  var mineDifficulty = 'normal';
  function renderMinesweeper(){
    var body = $('#app-body');
    body.innerHTML = '';
    var wrap = el('div'); wrap.style.cssText='display:flex; flex-direction:column; align-items:center; gap:12px;';
    wrap.appendChild(el('h2','','MINESWEEPER'));

    var diffRow = el('div','tabbar');
    [['easy','Easy 6x6'],['normal','Normal 8x8'],['hard','Hard 10x10']].forEach(function(d){
      var b = el('div','btn98'+(mineDifficulty===d[0]?' accent':''), d[1]);
      b.addEventListener('click', function(){ mineDifficulty=d[0]; renderMinesweeper(); });
      diffRow.appendChild(b);
    });
    wrap.appendChild(diffRow);

    var status = el('div','','Find the mines. Tap to reveal.');
    wrap.appendChild(status);
    var hiEl = el('div','', (function(){ var b=getHighScore('minesweeper', mineDifficulty); return 'Best time: '+(b!=null ? b+'s' : '--'); })());
    hiEl.style.cssText='font-size:14px; color:var(--ink-soft);';
    wrap.appendChild(hiEl);
    var startTs = Date.now();
    var grid = el('div'); grid.id='mine-grid';
    var size = mineDifficulty==='easy' ? 6 : (mineDifficulty==='hard' ? 10 : 8);
    var mineCount = mineDifficulty==='easy' ? 6 : (mineDifficulty==='hard' ? 18 : 10);
    grid.style.gridTemplateColumns = 'repeat('+size+', 1fr)';
    grid.style.gridTemplateRows = 'repeat('+size+', '+(size>8?26:32)+'px)';
    grid.style.width = (size*(size>8?28:34))+'px';
    var mines = new Set();
    while(mines.size<mineCount){ mines.add(Math.floor(Math.random()*size*size)); }
    var revealed = new Array(size*size).fill(false);
    var over=false;
    function neighbors(idx){
      var x=idx%size, y=Math.floor(idx/size), res=[];
      for(var dx=-1;dx<=1;dx++) for(var dy=-1;dy<=1;dy++){
        if(dx===0&&dy===0) continue;
        var nx=x+dx, ny=y+dy;
        if(nx>=0&&nx<size&&ny>=0&&ny<size) res.push(ny*size+nx);
      }
      return res;
    }
    function count(idx){ return neighbors(idx).filter(function(n){return mines.has(n);}).length; }
    var cells = [];
    function reveal(idx){
      if(revealed[idx]||over) return;
      revealed[idx]=true;
      var cell = cells[idx];
      cell.classList.add('open');
      if(mines.has(idx)){
        cell.classList.add('mine'); cell.textContent='*';
        over=true; status.textContent='Boom. Game over.'; sfx('lose');
        cells.forEach(function(c,i){ if(mines.has(i)){c.classList.add('open'); c.textContent='*';} });
        return;
      }
      var n = count(idx);
      cell.textContent = n>0?n:'';
      if(n===0){ neighbors(idx).forEach(reveal); }
      if(revealed.filter(Boolean).length === size*size-mineCount){
        over=true; status.textContent='Cleared! You win.'; sfx('win');
        var elapsed = Math.round((Date.now()-startTs)/1000);
        if(setHighScoreIfBetter('minesweeper', mineDifficulty, elapsed, false)){
          hiEl.textContent = 'Best time: '+elapsed+'s (new record!)';
        } else {
          hiEl.textContent = 'Cleared in '+elapsed+'s -- Best: '+getHighScore('minesweeper', mineDifficulty)+'s';
        }
      }
    }
    for(var i=0;i<size*size;i++){
      var c = el('div','mine-cell','');
      (function(idx){ c.addEventListener('click', function(){ reveal(idx); }); })(i);
      cells.push(c); grid.appendChild(c);
    }
    wrap.appendChild(grid);
    var restart = el('div','btn98 accent','New Board');
    restart.addEventListener('click', renderMinesweeper);
    wrap.appendChild(restart);
    body.appendChild(wrap);
  }

  var g2048Difficulty = 'normal';
  function renderG2048(){

    });
    wrap.appendChild(diffRow);

    var N = g2048Difficulty==='easy' ? 5 : (g2048Difficulty==='hard' ? 3 : 4);
    var scoreEl = el('div','','Score: 0');
    wrap.appendChild(scoreEl);
    var hiEl = el('div','','Best: '+(getHighScore('g2048', g2048Difficulty)||0));
    hiEl.style.cssText='font-size:14px; color:var(--ink-soft);';
    wrap.appendChild(hiEl);
    var grid = el('div','g2048-grid');
    grid.style.gridTemplateColumns = 'repeat('+N+', 1fr)';
    grid.style.width = Math.min(300, N*66)+'px';
    var cells = [];
    for(var i=0;i<N*N;i++){ var c=el('div','g2048-cell',''); cells.push(c); grid.appendChild(c); }
    wrap.appendChild(grid);
    var status = el('div','','Swipe to move tiles.');
    wrap.appendChild(status);
    var restart = el('div','btn98 accent','New Game');
    wrap.appendChild(restart);
    body.appendChild(wrap);

    var board, score;
    var COLORS = {2:'#dbe6d2',4:'#c9d6bf',8:'#f2c85b',16:'#e8935a',32:'#e07850',64:'#c9502f',
                  128:'#6fae8f',256:'#4a9a7a',512:'#4a6a94',1024:'#33507a',2048:'#b95050'};
    var wonAlready=false, lostAlready=false;
    function init(){ board = Array(N*N).fill(0); score=0; wonAlready=false; lostAlready=false; addTile(); addTile(); draw(); status.textContent='Swipe to move tiles.'; hiEl.textContent='Best: '+(getHighScore('g2048', g2048Difficulty)||0); }
    function addTile(){
      var empties=[]; board.forEach(function(v,i){ if(!v) empties.push(i); });
      if(!empties.length) return;
      board[empties[Math.floor(Math.random()*empties.length)]] = Math.random()<0.9?2:4;
    }
    function draw(){
      board.forEach(function(v,i){
        cells[i].textContent = v||'';
        cells[i].style.background = v ? (COLORS[v]||'#333') : '#dbe6d2';
        cells[i].style.color = v>=64 ? '#fff' : 'var(--ink)';
      });
      scoreEl.textContent = 'Score: '+score;
    }
    function slideRow(row){
      var arr = row.filter(function(v){return v;});
      for(var i=0;i<arr.length-1;i++){
        if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); }
      }
      while(arr.length<N) arr.push(0);
      return arr;
    }
    function getRow(r){ var out=[]; for(var i=0;i<N;i++) out.push(board[r*N+i]); return out; }
    function setRow(r,arr){ for(var i=0;i<N;i++) board[r*N+i]=arr[i]; }
    function getCol(c){ var out=[]; for(var i=0;i<N;i++) out.push(board[c+i*N]); return out; }
    function setCol(c,arr){ for(var i=0;i<N;i++) board[c+i*N]=arr[i]; }
    function move(dir){
      var changed=false;
      var before = board.slice();
      var scoreBefore = score;
      if(dir==='left'){ for(var r=0;r<N;r++) setRow(r, slideRow(getRow(r))); }
      if(dir==='right'){ for(var r2=0;r2<N;r2++) setRow(r2, slideRow(getRow(r2).slice().reverse()).reverse()); }
      if(dir==='up'){ for(var c=0;c<N;c++) setCol(c, slideRow(getCol(c))); }
      if(dir==='down'){ for(var c2=0;c2<N;c2++) setCol(c2, slideRow(getCol(c2).slice().reverse()).reverse()); }
      changed = board.some(function(v,i){return v!==before[i];});
      if(changed){
        if(score>scoreBefore) sfx('merge'); else sfx('bounce');
        addTile(); draw();
        if(setHighScoreIfBetter('g2048', g2048Difficulty, score, true)){ hiEl.textContent = 'Best: '+score+' (new record!)'; }
        else { hiEl.textContent = 'Best: '+(getHighScore('g2048', g2048Difficulty)||0); }
        if(board.indexOf(2048)>-1){ status.textContent='2048! You win! Keep going if you want.'; if(!wonAlready){ wonAlready=true; sfx('win'); } }
        else if(board.every(function(v){return v;}) && !canMerge()){ status.textContent='No more moves. Game over.'; if(!lostAlready){ lostAlready=true; sfx('lose'); } }
        else status.textContent='Swipe to move tiles.';
      }
    }
    function canMerge(){
      for(var r=0;r<N;r++) for(var c=0;c<N;c++){
        var v = board[r*N+c];
        if(c<N-1 && board[r*N+c+1]===v) return true;
        if(r<N-1 && board[(r+1)*N+c]===v) return true;
      }
      return false;
    }
    restart.addEventListener('click', init);
    var sx=0, sy=0;
    grid.addEventListener('touchstart', function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
    grid.addEventListener('touchend', function(e){
      var t=e.changedTouches[0]; var dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
      if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
    }, {passive:true});
    init();
  }

  /* ===================== MEMORY MATCH ===================== */
  var memoryDifficulty = 'normal';
  function renderMemory(){
    var body = $('#app-body');
    body.innerHTML = '';
    var wrap = el('div'); wrap.style.cssText='display:flex; flex-direction:column; align-items:center; gap:12px;';
    wrap.appendChild(el('h2','','MEMORY MATCH'));

    var diffRow = el('div','tabbar');
    [['easy','Easy 3x4'],['normal','Normal 4x4'],['hard','Hard 4x6']].forEach(function(d){
      var b = el('div','btn98'+(memoryDifficulty===d[0]?' accent':''), d[1]);
      b.addEventListener('click', function(){ memoryDifficulty=d[0]; renderMemory(); });
      diffRow.appendChild(b);
    });
    wrap.appendChild(diffRow);

    var status = el('div','','Moves: 0');
    wrap.appendChild(status);
    var hiEl = el('div','', (function(){ var b=getHighScore('memory', memoryDifficulty); return 'Best: '+(b!=null ? b+' moves' : '--'); })());
    hiEl.style.cssText='font-size:14px; color:var(--ink-soft);';
    wrap.appendChild(hiEl);
    var pairCount = memoryDifficulty==='easy' ? 6 : (memoryDifficulty==='hard' ? 12 : 8);
    var cols = memoryDifficulty==='hard' ? 4 : (memoryDifficulty==='easy' ? 3 : 4);
    var grid = el('div','mem-grid');
    grid.style.gridTemplateColumns = 'repeat('+cols+', 1fr)';
    grid.style.width = (cols*62)+'px';
    wrap.appendChild(grid);
    var restart = el('div','btn98 accent','New Game');
    wrap.appendChild(restart);
    body.appendChild(wrap);

    var allIcons = ['\u{1F34E}','\u{1F680}','\u{1F3B8}','\u{1F47E}','\u{1F36D}','\u{1F433}','\u2B50','\u{1F4BE}','\u{1F984}','\u{1F369}','\u{1F3AF}','\u{1F9E9}'];
    var deck, flipped, matched, moves, lock;
    function init(){
      var icons = allIcons.slice(0, pairCount);
      deck = icons.concat(icons).map(function(v,i){return {icon:v, id:i};});
      for(var i=deck.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=deck[i]; deck[i]=deck[j]; deck[j]=tmp; }
      flipped=[]; matched=[]; moves=0; lock=false;
      status.textContent='Moves: 0';
      hiEl.textContent = (function(){ var b=getHighScore('memory', memoryDifficulty); return 'Best: '+(b!=null ? b+' moves' : '--'); })();
      grid.innerHTML='';
      deck.forEach(function(d,idx){
        var c = el('div','mem-cell','');
        c.addEventListener('click', function(){ flip(idx); });
        grid.appendChild(c);
      });
      draw();
    }
    function draw(){
      Array.from(grid.children).forEach(function(c,idx){
        var show = matched.indexOf(idx)>-1 || flipped.indexOf(idx)>-1;
        c.textContent = show ? deck[idx].icon : '';
        c.classList.toggle('matched', matched.indexOf(idx)>-1);
        c.classList.toggle('flipped', flipped.indexOf(idx)>-1);
      });
    }
    function flip(idx){
      if(lock || flipped.indexOf(idx)>-1 || matched.indexOf(idx)>-1) return;
      flipped.push(idx); draw();
      if(flipped.length===2){
        moves++; status.textContent='Moves: '+moves;
        lock=true;
        var a=flipped[0], b=flipped[1];
        if(deck[a].icon===deck[b].icon){
          sfx('success');
          matched.push(a,b); flipped=[]; lock=false; draw();
          if(matched.length===deck.length){
            status.textContent='Solved in '+moves+' moves!'; sfx('win');
            if(setHighScoreIfBetter('memory', memoryDifficulty, moves, false)){
              hiEl.textContent = 'Best: '+moves+' moves (new record!)';
            }
          }
        } else {
          sfx('lose');
          setTimeout(function(){ flipped=[]; lock=false; draw(); }, 700);
        }
      }
    }
    restart.addEventListener('click', init);
    init();
  }

  /* ===================== PONG ===================== */
  var pongLoop = null;
  var pongDifficulty = 'normal';
  function renderPong(){
    var body = $('#app-body');
    body.innerHTML = '';
    var wrap = el('div'); wrap.style.cssText='display:flex; flex-direction:column; align-items:center; gap:12px;';
    wrap.appendChild(el('h2','','PONG'));

    var diffRow = el('div','tabbar');
    [['easy','Easy'],['normal','Normal'],['hard','Hard']].forEach(function(d){
      var b = el('div','btn98'+(pongDifficulty===d[0]?' accent':''), d[1]);
      b.addEventListener('click', function(){ pongDifficulty=d[0]; renderPong(); });
      diffRow.appendChild(b);
    });
    wrap.appendChild(diffRow);

    var scoreEl = el('div','','You 0 - 0 CPU');
    wrap.appendChild(scoreEl);
    var hiEl = el('div','','Match wins: '+(getHighScore('pong', pongDifficulty)||0));
    hiEl.style.cssText='font-size:14px; color:var(--ink-soft);';
    wrap.appendChild(hiEl);
    var canvas = document.createElement('canvas');
    canvas.width = 260; canvas.height = 300;
    wrap.appendChild(canvas);
    wrap.appendChild(el('p','','Drag up/down on the board to move your paddle (left side).'));
    var restart = el('div','btn98 accent','Restart');
    wrap.appendChild(restart);
    body.appendChild(wrap);

    var ctx = canvas.getContext('2d');
    var W=canvas.width, H=canvas.height, pw=8, ph=50;
    var cpuSpeed = pongDifficulty==='easy' ? 1.5 : (pongDifficulty==='hard' ? 3.6 : 2.4);
    var ballSpeed = pongDifficulty==='easy' ? 2.4 : (pongDifficulty==='hard' ? 4 : 3);
    var state2;
    function init(){
      state2 = { py:H/2-ph/2, cy:H/2-ph/2, bx:W/2, by:H/2, bvx:ballSpeed, bvy:2, you:0, cpu:0 };
      matchOver = false;
      hiEl.textContent = 'Match wins: '+(getHighScore('pong', pongDifficulty)||0)+' (first to 7 wins the match)';
    }
    function draw(){
      ctx.fillStyle='#dbe6d2'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#2b3226';
      ctx.fillRect(6, state2.py, pw, ph);
      ctx.fillRect(W-6-pw, state2.cy, pw, ph);
      ctx.beginPath(); ctx.arc(state2.bx, state2.by, 6, 0, Math.PI*2); ctx.fill();
      ctx.setLineDash([4,6]); ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.strokeStyle='#a9b89f'; ctx.stroke(); ctx.setLineDash([]);
    }
    function step(){
      if(matchOver) return;
      state2.bx += state2.bvx; state2.by += state2.bvy;
      if(state2.by<6 || state2.by>H-6){ state2.bvy *= -1; sfx('bounce'); }
      // cpu AI follows ball
      var cpuCenter = state2.cy+ph/2;
      if(cpuCenter < state2.by-8) state2.cy += cpuSpeed;
      else if(cpuCenter > state2.by+8) state2.cy -= cpuSpeed;
      state2.cy = Math.max(0, Math.min(H-ph, state2.cy));
      // paddle collisions
      if(state2.bx-6 <= 6+pw && state2.by >= state2.py && state2.by <= state2.py+ph && state2.bvx<0){
        state2.bvx *= -1.05; state2.bx = 6+pw+6; sfx('bounce');
      }
      if(state2.bx+6 >= W-6-pw && state2.by >= state2.cy && state2.by <= state2.cy+ph && state2.bvx>0){
        state2.bvx *= -1.05; state2.bx = W-6-pw-6; sfx('bounce');
      }
      if(state2.bx<0){ state2.cpu++; resetBall(-1); sfx('lose'); checkMatchEnd(); }
      if(state2.bx>W){ state2.you++; resetBall(1); sfx('score'); checkMatchEnd(); }
      scoreEl.textContent = 'You '+state2.you+' - '+state2.cpu+' CPU';
      draw();
    }
    function resetBall(dir){
      state2.bx=W/2; state2.by=H/2; state2.bvx=ballSpeed*dir; state2.bvy=(Math.random()<0.5?-1:1)*2;
    }
    var matchOver = false;
    function checkMatchEnd(){
      if(matchOver) return;
      if(state2.you>=7){
        matchOver = true;
        sfx('win');
        if(setHighScoreIfBetter('pong', pongDifficulty, (getHighScore('pong', pongDifficulty)||0)+1, true)){
          hiEl.textContent = 'Match wins: '+getHighScore('pong', pongDifficulty)+' -- you won this match!';
        }
      } else if(state2.cpu>=7){
        matchOver = true;
        sfx('lose');
        hiEl.textContent = 'Match wins: '+(getHighScore('pong', pongDifficulty)||0)+' -- CPU won this match.';
      }
    }
    canvas.addEventListener('touchmove', function(e){
      e.preventDefault();
      var r = canvas.getBoundingClientRect();
      var t = e.touches[0];
      var y = (t.clientY-r.top)*(H/r.height);
      state2.py = Math.max(0, Math.min(H-ph, y-ph/2));
    }, {passive:false});
    canvas.addEventListener('mousemove', function(e){
      var r = canvas.getBoundingClientRect();
      var y = (e.clientY-r.top)*(H/r.height);
      state2.py = Math.max(0, Math.min(H-ph, y-ph/2));
    });
    restart.addEventListener('click', function(){ init(); draw(); });
    clearInterval(pongLoop);
    init(); draw();
    pongLoop = setInterval(step, 1000/40);
  }

  /* ===================== EMBEDDED DOWNLOADABLE GAMES ===================== */
  function renderEmbeddedGame(htmlContent){
    var body = $('#app-body');
    body.innerHTML = '';
    body.style.padding = '0';
    var iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:100%; height:100%; border:none; display:block; background:#fff;';
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.srcdoc = htmlContent;
    body.appendChild(iframe);
  }
  function renderDayTrader(){ renderEmbeddedGame(DAY_TRADER_HTML); }
  function renderFakestake(){ renderEmbeddedGame(FAKESTAKE_HTML); }

  function renderCustomAppRunner(htmlContent){
    var body = $('#app-body');
    body.innerHTML = '';
    body.style.padding = '0';
    var iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:100%; height:100%; border:none; display:block; background:#fff;';
    // Sandboxed with no allow-same-origin: this content may come from another user
    // (via Share), so it must never be able to reach JonnyOS's own data/localStorage.
    iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-pointer-lock');
    iframe.srcdoc = htmlContent;
    body.appendChild(iframe);
  }

    ttt: renderTTT,

  if(activeAccountId()){
    loadState();
    if(!FS.Videos) FS.Videos = {type:'folder', children:{}};

    ensureAccountIdentity();
    attachAllRealListeners();

    renderLockNotifications();

  boot();
